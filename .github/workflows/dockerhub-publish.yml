name: Build & Push Docker Images to Hub

on:
  push:
    paths:
      - 'dockerhub-images/**'
    branches: [main]
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - name: devops-toolkit
            context: dockerhub-images/devops-toolkit
          - name: network-debug
            context: dockerhub-images/network-debug
          - name: backup-s3
            context: dockerhub-images/backup-s3
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.image.context }}
          push: true
          tags: |
            krishna8688/${{ matrix.image.name }}:latest
            krishna8688/${{ matrix.image.name }}:1.0.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
