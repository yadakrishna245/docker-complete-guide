<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="Arial, sans-serif">
  <rect width="900" height="320" fill="#0d1117" rx="12"/>
  <text x="450" y="30" text-anchor="middle" fill="#58a6ff" font-size="16" font-weight="bold">💾 Troubleshooting: Volume / Data Issues</text>

  <!-- Problem -->
  <rect x="350" y="45" width="200" height="35" fill="#1f2937" stroke="#ef4444" stroke-width="2" rx="8">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="450" y="67" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="bold">Volume / Data Problem</text>

  <!-- Three branches -->
  <line x1="380" y1="80" x2="150" y2="110" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,2">
    <animate attributeName="stroke-dashoffset" values="12;0" dur="0.6s" repeatCount="indefinite"/>
  </line>
  <line x1="450" y1="80" x2="450" y2="110" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,2">
    <animate attributeName="stroke-dashoffset" values="12;0" dur="0.6s" repeatCount="indefinite"/>
  </line>
  <line x1="520" y1="80" x2="740" y2="110" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,2">
    <animate attributeName="stroke-dashoffset" values="12;0" dur="0.6s" repeatCount="indefinite"/>
  </line>

  <!-- Branch A: Data lost -->
  <rect x="30" y="110" width="240" height="35" fill="#1f2937" stroke="#3b82f6" stroke-width="2" rx="8"/>
  <text x="150" y="132" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="bold">Data lost after restart</text>

  <line x1="150" y1="145" x2="150" y2="170" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,2">
    <animate attributeName="stroke-dashoffset" values="12;0" dur="0.6s" repeatCount="indefinite"/>
  </line>
  <rect x="70" y="170" width="160" height="28" fill="#374151" rx="5"/>
  <text x="150" y="188" text-anchor="middle" fill="#d1d5db" font-size="9">Using volumes?</text>

  <line x1="110" y1="198" x2="80" y2="220" stroke="#6b7280" stroke-width="1"/>
  <line x1="190" y1="198" x2="220" y2="220" stroke="#6b7280" stroke-width="1"/>
  <text x="75" y="216" fill="#ef4444" font-size="8">No</text>
  <text x="225" y="216" fill="#10b981" font-size="8">Yes</text>

  <rect x="20" y="225" width="135" height="45" fill="#1f2937" stroke="#10b981" stroke-width="1.5" rx="6"/>
  <text x="88" y="244" text-anchor="middle" fill="#6ee7b7" font-size="9" font-weight="bold">Fix: Add volume</text>
  <text x="88" y="260" text-anchor="middle" fill="#6b7280" font-size="8">-v mydata:/app/data</text>

  <rect x="165" y="225" width="135" height="45" fill="#1f2937" stroke="#f59e0b" stroke-width="1.5" rx="6"/>
  <text x="233" y="244" text-anchor="middle" fill="#fcd34d" font-size="9" font-weight="bold">Check mount path</text>
  <text x="233" y="260" text-anchor="middle" fill="#6b7280" font-size="8">docker inspect</text>

  <!-- Branch B: Permission denied -->
  <rect x="320" y="110" width="260" height="35" fill="#1f2937" stroke="#f59e0b" stroke-width="2" rx="8"/>
  <text x="450" y="132" text-anchor="middle" fill="#fcd34d" font-size="10" font-weight="bold">Permission denied in container</text>

  <line x1="450" y1="145" x2="450" y2="170" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,2">
    <animate attributeName="stroke-dashoffset" values="12;0" dur="0.6s" repeatCount="indefinite"/>
  </line>
  <rect x="375" y="170" width="150" height="28" fill="#374151" rx="5"/>
  <text x="450" y="188" text-anchor="middle" fill="#d1d5db" font-size="9">ls -la /path → check owner</text>

  <line x1="420" y1="198" x2="380" y2="220" stroke="#6b7280" stroke-width="1"/>
  <line x1="480" y1="198" x2="520" y2="220" stroke="#6b7280" stroke-width="1"/>
  <text x="350" y="216" fill="#9ca3af" font-size="8">Root owns</text>
  <text x="535" y="216" fill="#9ca3af" font-size="8">UID mismatch</text>

  <rect x="320" y="225" width="145" height="45" fill="#1f2937" stroke="#10b981" stroke-width="1.5" rx="6"/>
  <text x="393" y="244" text-anchor="middle" fill="#6ee7b7" font-size="9" font-weight="bold">Fix in Dockerfile:</text>
  <text x="393" y="260" text-anchor="middle" fill="#6b7280" font-size="8">RUN chown -R user /path</text>

  <rect x="475" y="225" width="145" height="45" fill="#1f2937" stroke="#10b981" stroke-width="1.5" rx="6"/>
  <text x="548" y="244" text-anchor="middle" fill="#6ee7b7" font-size="9" font-weight="bold">Fix: Match UID</text>
  <text x="548" y="260" text-anchor="middle" fill="#6b7280" font-size="8">-u $(id -u):$(id -g)</text>

  <!-- Branch C: Volume not showing data -->
  <rect x="630" y="110" width="240" height="35" fill="#1f2937" stroke="#ec4899" stroke-width="2" rx="8"/>
  <text x="750" y="132" text-anchor="middle" fill="#f472b6" font-size="10" font-weight="bold">Volume not showing data</text>

  <line x1="750" y1="145" x2="750" y2="170" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="4,2">
    <animate attributeName="stroke-dashoffset" values="12;0" dur="0.6s" repeatCount="indefinite"/>
  </line>
  <rect x="670" y="170" width="160" height="28" fill="#374151" rx="5"/>
  <text x="750" y="188" text-anchor="middle" fill="#d1d5db" font-size="9">docker inspect → Mounts</text>

  <line x1="720" y1="198" x2="690" y2="220" stroke="#6b7280" stroke-width="1"/>
  <line x1="780" y1="198" x2="810" y2="220" stroke="#6b7280" stroke-width="1"/>
  <text x="680" y="216" fill="#9ca3af" font-size="8">Wrong path</text>
  <text x="820" y="216" fill="#9ca3af" font-size="8">Correct</text>

  <rect x="635" y="225" width="120" height="45" fill="#1f2937" stroke="#10b981" stroke-width="1.5" rx="6"/>
  <text x="695" y="244" text-anchor="middle" fill="#6ee7b7" font-size="9" font-weight="bold">Fix -v path</text>
  <text x="695" y="260" text-anchor="middle" fill="#6b7280" font-size="8">Correct the mount</text>

  <rect x="765" y="225" width="120" height="45" fill="#1f2937" stroke="#f59e0b" stroke-width="1.5" rx="6"/>
  <text x="825" y="244" text-anchor="middle" fill="#fcd34d" font-size="9" font-weight="bold">Check app writes</text>
  <text x="825" y="260" text-anchor="middle" fill="#6b7280" font-size="8">to that path</text>

  <text x="450" y="305" text-anchor="middle" fill="#4b5563" font-size="10">💡 Always use named volumes for data that must survive container removal</text>
</svg>
