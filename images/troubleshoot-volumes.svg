<svg fill="none" viewBox="0 0 900 300" width="900" height="300" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes pulseRed { 0%,100%{border-color:#dc2626} 50%{border-color:#991b1b} }
        @keyframes pulseGreen { 0%,100%{border-color:#16a34a} 50%{border-color:#166534} }
        .wrap{background:#0d1117;padding:16px;font-family:Arial,sans-serif;color:#e5e7eb;display:flex;flex-direction:column;gap:10px;align-items:center;min-height:268px}
        .problem{background:#1f2937;border:2px solid #dc2626;border-radius:8px;padding:8px 16px;animation:pulseRed 2s infinite;font-weight:bold;font-size:14px}
        .card{background:#1f2937;border:1px solid #374151;border-radius:8px;padding:8px 12px;font-size:12px;text-align:center}
        .solution{background:#1f2937;border:2px solid #16a34a;border-radius:8px;padding:6px 10px;font-size:11px;animation:pulseGreen 2s infinite;text-align:center}
        .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
        .arrow{color:#6b7280;font-size:14px}
        .code{background:#374151;border-radius:4px;padding:2px 6px;font-family:monospace;font-size:11px;color:#60a5fa}
        .col{display:flex;flex-direction:column;gap:6px;align-items:center}
      </style>
      <div class="wrap">
        <div class="problem">💾 Volume / Data Issue</div>
        <div class="arrow">↓</div>
        <div class="row">
          <div class="col">
            <div class="card"><b>A) Data Lost on Restart</b></div>
            <div class="arrow">↓</div>
            <div class="card">Using volumes?</div>
            <div class="arrow">↓</div>
            <div class="solution">Add volume:<br/><span class="code">-v mydata:/app/data</span></div>
          </div>
          <div class="col">
            <div class="card"><b>B) Permission Denied</b></div>
            <div class="arrow">↓</div>
            <div class="card">Check file owner<br/><span class="code">ls -la /mount</span></div>
            <div class="arrow">↓</div>
            <div class="solution">Fix:<br/><span class="code">chown -R 1000:1000</span><br/>or match UID in Dockerfile</div>
          </div>
          <div class="col">
            <div class="card"><b>C) Volume Not Showing</b></div>
            <div class="arrow">↓</div>
            <div class="card"><span class="code">docker inspect &lt;id&gt;</span><br/>Check Mounts section</div>
            <div class="arrow">↓</div>
            <div class="solution">Fix mount path<br/>Use absolute paths<br/><span class="code">$(pwd):/app</span></div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
