<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" font-family="Arial, sans-serif">
  <rect width="900" height="250" fill="#0d1117" rx="12"/>
  <text x="450" y="30" text-anchor="middle" fill="#58a6ff" font-size="16" font-weight="bold">🐌 Troubleshooting: Container Running Slow</text>

  <!-- Problem -->
  <rect x="350" y="45" width="200" height="35" fill="#1f2937" stroke="#ef4444" stroke-width="2" rx="8">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="450" y="67" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="bold">Container is slow</text>

  <!-- docker stats -->
  <line x1="450" y1="80" x2="450" y2="100" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,2">
    <animate attributeName="stroke-dashoffset" values="12;0" dur="0.6s" repeatCount="indefinite"/>
  </line>
  <rect x="355" y="100" width="190" height="30" fill="#1f2937" stroke="#3b82f6" stroke-width="2" rx="6"/>
  <text x="450" y="119" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="bold">docker stats container</text>

  <!-- Four branches -->
  <line x1="380" y1="130" x2="130" y2="155" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,2">
    <animate attributeName="stroke-dashoffset" values="12;0" dur="0.6s" repeatCount="indefinite"/>
  </line>
  <line x1="420" y1="130" x2="340" y2="155" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,2">
    <animate attributeName="stroke-dashoffset" values="12;0" dur="0.6s" repeatCount="indefinite"/>
  </line>
  <line x1="480" y1="130" x2="560" y2="155" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,2">
    <animate attributeName="stroke-dashoffset" values="12;0" dur="0.6s" repeatCount="indefinite"/>
  </line>
  <line x1="520" y1="130" x2="770" y2="155" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,2">
    <animate attributeName="stroke-dashoffset" values="12;0" dur="0.6s" repeatCount="indefinite"/>
  </line>

  <!-- CPU -->
  <rect x="30" y="155" width="200" height="70" fill="#1f2937" stroke="#ef4444" stroke-width="2" rx="8">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="130" y="175" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="bold">🔥 CPU > 90%</text>
  <text x="130" y="195" text-anchor="middle" fill="#6ee7b7" font-size="9">Fix: Increase --cpus</text>
  <text x="130" y="210" text-anchor="middle" fill="#6b7280" font-size="8">Or optimize app code</text>

  <!-- Memory -->
  <rect x="250" y="155" width="200" height="70" fill="#1f2937" stroke="#f59e0b" stroke-width="2" rx="8">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="0.5s" repeatCount="indefinite"/>
  </rect>
  <text x="350" y="175" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="bold">💾 Memory near limit</text>
  <text x="350" y="195" text-anchor="middle" fill="#6ee7b7" font-size="9">Fix: Increase -m limit</text>
  <text x="350" y="210" text-anchor="middle" fill="#6b7280" font-size="8">Check for memory leaks</text>

  <!-- I/O -->
  <rect x="470" y="155" width="200" height="70" fill="#1f2937" stroke="#8b5cf6" stroke-width="2" rx="8">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="1s" repeatCount="indefinite"/>
  </rect>
  <text x="570" y="175" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="bold">📀 I/O high</text>
  <text x="570" y="195" text-anchor="middle" fill="#6ee7b7" font-size="9">Fix: Use named volumes</text>
  <text x="570" y="210" text-anchor="middle" fill="#6b7280" font-size="8">Use tmpfs for temp files</text>

  <!-- All normal -->
  <rect x="690" y="155" width="190" height="70" fill="#1f2937" stroke="#10b981" stroke-width="2" rx="8">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </rect>
  <text x="785" y="175" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="bold">✅ All normal</text>
  <text x="785" y="195" text-anchor="middle" fill="#9ca3af" font-size="9">Not a Docker issue</text>
  <text x="785" y="210" text-anchor="middle" fill="#6b7280" font-size="8">Profile the app itself</text>

  <text x="450" y="243" text-anchor="middle" fill="#4b5563" font-size="10">💡 docker stats shows live CPU%, memory, I/O for all containers</text>
</svg>
