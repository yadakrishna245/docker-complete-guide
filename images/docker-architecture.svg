<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Arial, sans-serif">
  <!-- Background -->
  <rect width="900" height="400" fill="#0d1117" rx="12"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#58a6ff" font-size="18" font-weight="bold">Docker Architecture</text>
  
  <!-- Docker Client -->
  <rect x="30" y="150" width="180" height="100" fill="#1f2937" stroke="#3b82f6" stroke-width="2" rx="10">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="120" y="190" text-anchor="middle" fill="#60a5fa" font-size="14" font-weight="bold">Docker Client</text>
  <text x="120" y="215" text-anchor="middle" fill="#9ca3af" font-size="12">docker CLI</text>
  <text x="120" y="235" text-anchor="middle" fill="#6b7280" font-size="11">build | run | pull</text>
  
  <!-- Arrow: Client to Daemon -->
  <line x1="210" y1="200" x2="310" y2="200" stroke="#3b82f6" stroke-width="2" stroke-dasharray="8,4">
    <animate attributeName="stroke-dashoffset" values="24;0" dur="1s" repeatCount="indefinite"/>
  </line>
  <polygon points="310,195 320,200 310,205" fill="#3b82f6">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1s" repeatCount="indefinite"/>
  </polygon>
  <text x="265" y="188" text-anchor="middle" fill="#9ca3af" font-size="10">REST API</text>
  
  <!-- Docker Daemon -->
  <rect x="320" y="120" width="220" height="160" fill="#1f2937" stroke="#10b981" stroke-width="2" rx="10">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="430" y="155" text-anchor="middle" fill="#34d399" font-size="14" font-weight="bold">Docker Daemon</text>
  <text x="430" y="175" text-anchor="middle" fill="#9ca3af" font-size="11">dockerd</text>
  
  <!-- Daemon sub-components -->
  <rect x="340" y="190" width="90" height="30" fill="#374151" rx="5"/>
  <text x="385" y="210" text-anchor="middle" fill="#d1d5db" font-size="10">Container Runtime</text>
  
  <rect x="440" y="190" width="85" height="30" fill="#374151" rx="5"/>
  <text x="482" y="210" text-anchor="middle" fill="#d1d5db" font-size="10">Image Mgr</text>
  
  <rect x="340" y="230" width="90" height="30" fill="#374151" rx="5"/>
  <text x="385" y="250" text-anchor="middle" fill="#d1d5db" font-size="10">Network Driver</text>
  
  <rect x="440" y="230" width="85" height="30" fill="#374151" rx="5"/>
  <text x="482" y="250" text-anchor="middle" fill="#d1d5db" font-size="10">Volume Driver</text>

  <!-- Arrows from Daemon to right side -->
  <!-- To Containers -->
  <line x1="540" y1="160" x2="620" y2="90" stroke="#f59e0b" stroke-width="2">
    <animate attributeName="stroke-dashoffset" values="20;0" dur="1.5s" repeatCount="indefinite"/>
  </line>
  <rect x="620" y="60" width="140" height="55" fill="#1f2937" stroke="#f59e0b" stroke-width="2" rx="8"/>
  <text x="690" y="82" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="bold">🐳 Containers</text>
  <text x="690" y="102" text-anchor="middle" fill="#9ca3af" font-size="10">Running instances</text>
  
  <!-- To Images -->
  <line x1="540" y1="200" x2="620" y2="175" stroke="#8b5cf6" stroke-width="2">
    <animate attributeName="stroke-dashoffset" values="20;0" dur="1.5s" repeatCount="indefinite"/>
  </line>
  <rect x="620" y="145" width="140" height="55" fill="#1f2937" stroke="#8b5cf6" stroke-width="2" rx="8"/>
  <text x="690" y="167" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="bold">📦 Images</text>
  <text x="690" y="187" text-anchor="middle" fill="#9ca3af" font-size="10">Read-only templates</text>
  
  <!-- To Networks -->
  <line x1="540" y1="220" x2="620" y2="260" stroke="#06b6d4" stroke-width="2">
    <animate attributeName="stroke-dashoffset" values="20;0" dur="1.5s" repeatCount="indefinite"/>
  </line>
  <rect x="620" y="230" width="140" height="55" fill="#1f2937" stroke="#06b6d4" stroke-width="2" rx="8"/>
  <text x="690" y="252" text-anchor="middle" fill="#22d3ee" font-size="12" font-weight="bold">🌐 Networks</text>
  <text x="690" y="272" text-anchor="middle" fill="#9ca3af" font-size="10">Container comms</text>
  
  <!-- To Volumes -->
  <line x1="540" y1="250" x2="620" y2="340" stroke="#ec4899" stroke-width="2">
    <animate attributeName="stroke-dashoffset" values="20;0" dur="1.5s" repeatCount="indefinite"/>
  </line>
  <rect x="620" y="315" width="140" height="55" fill="#1f2937" stroke="#ec4899" stroke-width="2" rx="8"/>
  <text x="690" y="337" text-anchor="middle" fill="#f472b6" font-size="12" font-weight="bold">💾 Volumes</text>
  <text x="690" y="357" text-anchor="middle" fill="#9ca3af" font-size="10">Persistent storage</text>

  <!-- Registry -->
  <line x1="430" y1="280" x2="430" y2="330" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,3">
    <animate attributeName="stroke-dashoffset" values="18;0" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <polygon points="425,330 430,340 435,330" fill="#3b82f6"/>
  <rect x="340" y="340" width="180" height="50" fill="#1f2937" stroke="#3b82f6" stroke-width="2" rx="8"/>
  <text x="430" y="362" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="bold">📚 Registry</text>
  <text x="430" y="380" text-anchor="middle" fill="#9ca3af" font-size="10">Docker Hub / ECR / ACR</text>
  
  <!-- Animated data flow dots -->
  <circle r="4" fill="#3b82f6">
    <animateMotion dur="2s" repeatCount="indefinite" path="M215,200 L315,200"/>
  </circle>
  <circle r="3" fill="#f59e0b">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M540,160 L620,90"/>
  </circle>
  <circle r="3" fill="#8b5cf6">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M540,200 L620,175"/>
  </circle>
</svg>
