<svg fill="none" viewBox="0 0 900 450" width="900" height="450" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .wrap {
          width: 900px; height: 450px;
          background: #0d1117;
          border-radius: 12px;
          font-family: Arial, sans-serif;
          position: relative;
        }
        .title { text-align: center; color: #58a6ff; font-size: 16px; font-weight: bold; padding-top: 15px; }
        @keyframes bPurple { 0%,100%{ border-color: rgba(139,92,246,0.4); } 50%{ border-color: rgba(139,92,246,1); } }
        @keyframes bGreen { 0%,100%{ border-color: rgba(16,185,129,0.4); } 50%{ border-color: rgba(16,185,129,1); } }
        @keyframes bYellow { 0%,100%{ border-color: rgba(245,158,11,0.5); } 50%{ border-color: rgba(245,158,11,1); } }
        .registry { position: absolute; top: 50px; left: 220px; width: 460px; height: 95px; background: #1f2937; border: 2px solid #8b5cf6; border-radius: 10px; animation: bPurple 3s ease-in-out infinite; }
        .reg-title { text-align: center; color: #a78bfa; font-size: 12px; font-weight: bold; padding-top: 8px; }
        .reg-images { display: flex; justify-content: center; gap: 20px; margin-top: 10px; }
        .reg-img { background: #374151; border-radius: 6px; padding: 7px 18px; color: #d1d5db; font-size: 11px; }
        .host { position: absolute; top: 210px; left: 150px; width: 600px; height: 220px; background: #1f2937; border: 2px solid #10b981; border-radius: 10px; animation: bGreen 3s ease-in-out 0.5s infinite; }
        .host-title { text-align: center; color: #34d399; font-size: 12px; font-weight: bold; padding-top: 8px; }
        .locals { display: flex; justify-content: center; gap: 60px; margin-top: 15px; }
        .local { background: #374151; border: 1.5px solid #6366f1; border-radius: 6px; padding: 8px 16px; color: #a5b4fc; font-size: 11px; }
        .containers { display: flex; justify-content: center; gap: 20px; margin-top: 50px; }
        .cbox { background: #374151; border: 1.5px solid #f59e0b; border-radius: 6px; padding: 8px 14px; text-align: center; width: 120px; animation: bYellow 2s ease-in-out infinite; }
        .cbox:nth-child(2) { animation-delay: 0.3s; }
        .cbox:nth-child(3) { animation-delay: 0.6s; }
        .cname { color: #fbbf24; font-size: 10px; }
        .csub { color: #6b7280; font-size: 9px; }
        .arrows { position: absolute; color: #9ca3af; font-size: 9px; }
        .pull-row { display: flex; justify-content: center; gap: 180px; position: absolute; top: 155px; left: 0; width: 900px; }
        .pull-item { text-align: center; color: #9ca3af; font-size: 9px; }
        .pull-item::before { content: '↓'; display: block; color: #8b5cf6; font-size: 18px; }
        .run-row { display: flex; justify-content: center; gap: 50px; margin-top: 12px; }
        .run-item { text-align: center; color: #9ca3af; font-size: 9px; }
        .run-item::after { content: '▼'; display: block; color: #f59e0b; font-size: 12px; margin-top: 2px; }
      </style>
      <div class="wrap">
        <div class="title">Docker Images: Registry → Host → Containers</div>
        <div class="registry">
          <div class="reg-title">📚 Docker Registry (Docker Hub)</div>
          <div class="reg-images">
            <div class="reg-img">nginx:latest</div>
            <div class="reg-img">postgres:15</div>
            <div class="reg-img">node:18</div>
          </div>
        </div>
        <div class="pull-row">
          <div class="pull-item">docker pull</div>
          <div class="pull-item">docker pull</div>
        </div>
        <div class="host">
          <div class="host-title">🖥️ Docker Host</div>
          <div class="locals">
            <div class="local">📦 Local: nginx</div>
            <div class="local">📦 Local: postgres</div>
          </div>
          <div class="run-row">
            <div class="run-item">docker run</div>
            <div class="run-item">docker run</div>
            <div class="run-item">docker run</div>
          </div>
          <div class="containers">
            <div class="cbox"><div class="cname">🐳 Container 1</div><div class="csub">nginx</div></div>
            <div class="cbox"><div class="cname">🐳 Container 2</div><div class="csub">nginx</div></div>
            <div class="cbox"><div class="cname">🐳 Container 3</div><div class="csub">postgres</div></div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
