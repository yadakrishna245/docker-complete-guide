<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Arial, sans-serif">
  <rect width="900" height="420" fill="#0d1117" rx="12"/>
  <text x="450" y="35" text-anchor="middle" fill="#58a6ff" font-size="16" font-weight="bold">Docker Images: Registry → Host → Containers</text>

  <!-- Registry Box -->
  <rect x="220" y="55" width="460" height="80" fill="#1f2937" stroke="#8b5cf6" stroke-width="2" rx="10">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="450" y="75" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="bold">📚 Docker Registry (Docker Hub)</text>
  <rect x="245" y="90" width="120" height="35" fill="#374151" rx="6"/>
  <text x="305" y="112" text-anchor="middle" fill="#d1d5db" font-size="11">nginx:latest</text>
  <rect x="390" y="90" width="120" height="35" fill="#374151" rx="6"/>
  <text x="450" y="112" text-anchor="middle" fill="#d1d5db" font-size="11">postgres:15</text>
  <rect x="535" y="90" width="120" height="35" fill="#374151" rx="6"/>
  <text x="595" y="112" text-anchor="middle" fill="#d1d5db" font-size="11">node:18</text>

  <!-- Pull Arrows -->
  <line x1="305" y1="135" x2="305" y2="175" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6,3">
    <animate attributeName="stroke-dashoffset" values="18;0" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <polygon points="300,175 305,185 310,175" fill="#8b5cf6"/>
  <text x="330" y="160" fill="#9ca3af" font-size="9">docker pull</text>

  <line x1="520" y1="135" x2="520" y2="175" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6,3">
    <animate attributeName="stroke-dashoffset" values="18;0" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <polygon points="515,175 520,185 525,175" fill="#8b5cf6"/>
  <text x="545" y="160" fill="#9ca3af" font-size="9">docker pull</text>

  <!-- Docker Host Box -->
  <rect x="150" y="190" width="600" height="210" fill="#1f2937" stroke="#10b981" stroke-width="2" rx="10">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" begin="0.5s" repeatCount="indefinite"/>
  </rect>
  <text x="450" y="212" text-anchor="middle" fill="#34d399" font-size="12" font-weight="bold">🖥️ Docker Host</text>

  <!-- Local Images -->
  <rect x="220" y="225" width="150" height="40" fill="#374151" stroke="#6366f1" stroke-width="1.5" rx="6"/>
  <text x="295" y="250" text-anchor="middle" fill="#a5b4fc" font-size="11">📦 Local: nginx</text>
  <rect x="480" y="225" width="150" height="40" fill="#374151" stroke="#6366f1" stroke-width="1.5" rx="6"/>
  <text x="555" y="250" text-anchor="middle" fill="#a5b4fc" font-size="11">📦 Local: postgres</text>

  <!-- Run Arrows -->
  <line x1="250" y1="265" x2="250" y2="310" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3">
    <animate attributeName="stroke-dashoffset" values="16;0" dur="0.7s" repeatCount="indefinite"/>
  </line>
  <polygon points="245,310 250,320 255,310" fill="#f59e0b"/>
  <text x="220" y="293" fill="#9ca3af" font-size="9">docker run</text>

  <line x1="340" y1="265" x2="380" y2="310" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3">
    <animate attributeName="stroke-dashoffset" values="16;0" dur="0.7s" repeatCount="indefinite"/>
  </line>
  <polygon points="375,310 385,320 380,308" fill="#f59e0b"/>
  <text x="345" y="293" fill="#9ca3af" font-size="9">docker run</text>

  <line x1="555" y1="265" x2="555" y2="310" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3">
    <animate attributeName="stroke-dashoffset" values="16;0" dur="0.7s" repeatCount="indefinite"/>
  </line>
  <polygon points="550,310 555,320 560,310" fill="#f59e0b"/>
  <text x="525" y="293" fill="#9ca3af" font-size="9">docker run</text>

  <!-- Containers -->
  <rect x="200" y="325" width="120" height="50" fill="#374151" stroke="#f59e0b" stroke-width="1.5" rx="6">
    <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="260" y="345" text-anchor="middle" fill="#fbbf24" font-size="10">🐳 Container 1</text>
  <text x="260" y="363" text-anchor="middle" fill="#6b7280" font-size="9">nginx</text>

  <rect x="340" y="325" width="120" height="50" fill="#374151" stroke="#f59e0b" stroke-width="1.5" rx="6">
    <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2s" begin="0.3s" repeatCount="indefinite"/>
  </rect>
  <text x="400" y="345" text-anchor="middle" fill="#fbbf24" font-size="10">🐳 Container 2</text>
  <text x="400" y="363" text-anchor="middle" fill="#6b7280" font-size="9">nginx</text>

  <rect x="500" y="325" width="120" height="50" fill="#374151" stroke="#f59e0b" stroke-width="1.5" rx="6">
    <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2s" begin="0.6s" repeatCount="indefinite"/>
  </rect>
  <text x="560" y="345" text-anchor="middle" fill="#fbbf24" font-size="10">🐳 Container 3</text>
  <text x="560" y="363" text-anchor="middle" fill="#6b7280" font-size="9">postgres</text>

  <!-- Animated dots -->
  <circle r="3" fill="#8b5cf6">
    <animateMotion dur="2s" repeatCount="indefinite" path="M305,135 L305,185"/>
  </circle>
  <circle r="3" fill="#f59e0b">
    <animateMotion dur="2s" begin="1s" repeatCount="indefinite" path="M250,265 L250,320"/>
  </circle>
</svg>
