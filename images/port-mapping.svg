<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" font-family="Arial, sans-serif">
  <rect width="900" height="200" fill="#0d1117" rx="12"/>
  <text x="450" y="30" text-anchor="middle" fill="#58a6ff" font-size="16" font-weight="bold">Docker Port Mapping (-p 8080:80)</text>

  <!-- User -->
  <rect x="40" y="60" width="150" height="90" fill="#1f2937" stroke="#8b5cf6" stroke-width="2" rx="10">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="115" y="95" text-anchor="middle" fill="#a78bfa" font-size="24">👤</text>
  <text x="115" y="118" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="bold">User</text>
  <text x="115" y="137" text-anchor="middle" fill="#6b7280" font-size="10">localhost:8080</text>

  <!-- Arrow 1 -->
  <line x1="190" y1="105" x2="260" y2="105" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6,3">
    <animate attributeName="stroke-dashoffset" values="18;0" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <polygon points="260,100 270,105 260,110" fill="#8b5cf6"/>
  <text x="225" y="95" fill="#9ca3af" font-size="9">Request</text>

  <!-- Host Port -->
  <rect x="270" y="60" width="150" height="90" fill="#1f2937" stroke="#3b82f6" stroke-width="2" rx="10">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="0.5s" repeatCount="indefinite"/>
  </rect>
  <text x="345" y="95" text-anchor="middle" fill="#60a5fa" font-size="14" font-weight="bold">Host Port</text>
  <text x="345" y="118" text-anchor="middle" fill="#93c5fd" font-size="22" font-weight="bold">8080</text>
  <text x="345" y="137" text-anchor="middle" fill="#6b7280" font-size="10">External</text>

  <!-- Arrow 2 -->
  <line x1="420" y1="105" x2="490" y2="105" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,3">
    <animate attributeName="stroke-dashoffset" values="18;0" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <polygon points="490,100 500,105 490,110" fill="#3b82f6"/>
  <text x="455" y="95" fill="#9ca3af" font-size="9">Maps to</text>

  <!-- Container Port -->
  <rect x="500" y="60" width="150" height="90" fill="#1f2937" stroke="#10b981" stroke-width="2" rx="10">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="1s" repeatCount="indefinite"/>
  </rect>
  <text x="575" y="95" text-anchor="middle" fill="#34d399" font-size="14" font-weight="bold">Container Port</text>
  <text x="575" y="118" text-anchor="middle" fill="#6ee7b7" font-size="22" font-weight="bold">80</text>
  <text x="575" y="137" text-anchor="middle" fill="#6b7280" font-size="10">Internal</text>

  <!-- Arrow 3 -->
  <line x1="650" y1="105" x2="720" y2="105" stroke="#10b981" stroke-width="2" stroke-dasharray="6,3">
    <animate attributeName="stroke-dashoffset" values="18;0" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <polygon points="720,100 730,105 720,110" fill="#10b981"/>

  <!-- Nginx App -->
  <rect x="730" y="60" width="140" height="90" fill="#1f2937" stroke="#f59e0b" stroke-width="2" rx="10">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </rect>
  <text x="800" y="95" text-anchor="middle" fill="#fbbf24" font-size="24">🌐</text>
  <text x="800" y="118" text-anchor="middle" fill="#fcd34d" font-size="12" font-weight="bold">Nginx</text>
  <text x="800" y="137" text-anchor="middle" fill="#6b7280" font-size="10">inside container</text>

  <!-- Animated dot -->
  <circle r="4" fill="#8b5cf6">
    <animateMotion dur="4s" repeatCount="indefinite" path="M115,105 L345,105 L575,105 L800,105"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="1s" repeatCount="indefinite"/>
  </circle>

  <text x="450" y="185" text-anchor="middle" fill="#4b5563" font-size="10">Traffic flows: Browser → Host Port → Container Port → Application</text>
</svg>
