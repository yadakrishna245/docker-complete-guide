<svg fill="none" viewBox="0 0 900 180" width="900" height="180" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes pulsePurple { 0%,100%{border-color:#8b5cf6} 50%{border-color:#a78bfa} }
        @keyframes pulseBlue { 0%,100%{border-color:#3b82f6} 50%{border-color:#60a5fa} }
        @keyframes pulseGreen { 0%,100%{border-color:#10b981} 50%{border-color:#34d399} }
        @keyframes pulseYellow { 0%,100%{border-color:#f59e0b} 50%{border-color:#fbbf24} }
        .wrap{background:#0d1117;padding:20px;font-family:Arial,sans-serif;color:#e5e7eb;display:flex;flex-direction:column;align-items:center;justify-content:center;height:140px;box-sizing:border-box}
        .title{font-size:16px;font-weight:bold;margin-bottom:14px;color:#fff}
        .flow{display:flex;align-items:center;gap:12px}
        .box{background:#1f2937;border:3px solid;border-radius:12px;padding:12px 18px;text-align:center;min-width:120px}
        .box .icon{font-size:22px;margin-bottom:4px}
        .box .name{font-size:13px;font-weight:bold}
        .box .sub{font-size:11px;color:#9ca3af;margin-top:2px}
        .purple{animation:pulsePurple 2s infinite}
        .blue{animation:pulseBlue 2s infinite}
        .green{animation:pulseGreen 2s infinite}
        .yellow{animation:pulseYellow 2s infinite}
        .arr{font-size:22px;color:#6b7280}
      </style>
      <div class="wrap">
        <div class="title">🔌 Port Mapping (-p 8080:80)</div>
        <div class="flow">
          <div class="box purple"><div class="icon">👤</div><div class="name">User</div><div class="sub">Browser Request</div></div>
          <div class="arr">→</div>
          <div class="box blue"><div class="icon">🖥️</div><div class="name">Host :8080</div><div class="sub">Host Port</div></div>
          <div class="arr">→</div>
          <div class="box green"><div class="icon">📦</div><div class="name">Container :80</div><div class="sub">Container Port</div></div>
          <div class="arr">→</div>
          <div class="box yellow"><div class="icon">🌐</div><div class="name">Nginx App</div><div class="sub">Web Server</div></div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
