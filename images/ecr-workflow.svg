<svg fill="none" viewBox="0 0 900 350" width="900" height="350" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes pulseGreen { 0%,100%{border-color:#22c55e} 50%{border-color:#16a34a} }
        @keyframes pulseBlue { 0%,100%{border-color:#3b82f6} 50%{border-color:#1d4ed8} }
        @keyframes pulsePurple { 0%,100%{border-color:#a855f7} 50%{border-color:#7c3aed} }
        @keyframes pulsePink { 0%,100%{border-color:#ec4899} 50%{border-color:#db2777} }
        @keyframes pulseCyan { 0%,100%{border-color:#06b6d4} 50%{border-color:#0891b2} }
        .wrap{background:#0d1117;font-family:Arial,sans-serif;color:#e5e7eb;padding:12px;box-sizing:border-box;width:900px;height:350px;display:flex;flex-direction:column;align-items:center;gap:6px}
        .main-flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
        .step{background:#1f2937;border:2px solid #22c55e;animation:pulseGreen 3s infinite;border-radius:8px;padding:6px 12px;font-size:11px;text-align:center}
        .step-num{color:#22c55e;font-weight:bold;font-size:12px}
        .arrow-r{color:#22c55e;font-size:16px}
        .push-step{background:#1f2937;border:3px solid #22c55e;animation:pulseGreen 2s infinite;border-radius:10px;padding:12px 20px;font-size:13px;text-align:center;font-weight:bold}
        .branch-label{font-size:11px;color:#9ca3af;margin-top:4px}
        .branches{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:4px}
        .branch{border:2px solid;border-radius:8px;padding:8px 14px;font-size:11px;text-align:center;background:#1f2937}
        .b-deploy{border-color:#3b82f6;animation:pulseBlue 3s infinite}
        .b-lifecycle{border-color:#a855f7;animation:pulsePurple 3s infinite}
        .b-scan{border-color:#ec4899;animation:pulsePink 3s infinite}
        .b-region{border-color:#06b6d4;animation:pulseCyan 3s infinite}
        .down-arrow{color:#22c55e;font-size:14px}
      </style>
      <div class="wrap">
        <div class="main-flow">
          <div class="step"><span class="step-num">1</span><br/>Create Repo</div>
          <span class="arrow-r">→</span>
          <div class="step"><span class="step-num">2</span><br/>Auth Docker</div>
          <span class="arrow-r">→</span>
          <div class="step"><span class="step-num">3</span><br/>Build Image</div>
          <span class="arrow-r">→</span>
          <div class="step"><span class="step-num">4</span><br/>Tag for ECR</div>
        </div>
        <div class="down-arrow">↓</div>
        <div class="push-step"><span class="step-num">5</span> Push to ECR 🚀</div>
        <div class="down-arrow">↓ ↓ ↓ ↓</div>
        <div class="branch-label">Post-Push Actions</div>
        <div class="branches">
          <div class="branch b-deploy"><strong>6</strong> 🚀 Deploy<br/><span style="font-size:10px;color:#93c5fd">ECS / EKS / EC2</span></div>
          <div class="branch b-lifecycle"><strong>7</strong> 🔄 Lifecycle Policy<br/><span style="font-size:10px;color:#c4b5fd">Auto-cleanup old images</span></div>
          <div class="branch b-scan"><strong>8</strong> 🔍 Scanning<br/><span style="font-size:10px;color:#f9a8d4">Vulnerability detection</span></div>
          <div class="branch b-region"><strong>9</strong> 🌍 Cross-Region<br/><span style="font-size:10px;color:#67e8f9">Replicate globally</span></div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
