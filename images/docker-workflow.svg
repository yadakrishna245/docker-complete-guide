<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" font-family="Arial, sans-serif">
  <!-- Background -->
  <rect width="900" height="250" fill="#0d1117" rx="12"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" fill="#58a6ff" font-size="16" font-weight="bold">Docker Workflow: Build → Ship → Run</text>
  
  <!-- Step 1: Code -->
  <rect x="30" y="70" width="130" height="130" fill="#1f2937" stroke="#6366f1" stroke-width="2" rx="10">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="95" y="110" text-anchor="middle" fill="#818cf8" font-size="28">📝</text>
  <text x="95" y="140" text-anchor="middle" fill="#a5b4fc" font-size="13" font-weight="bold">Write Code</text>
  <text x="95" y="160" text-anchor="middle" fill="#6b7280" font-size="10">Dockerfile</text>
  <text x="95" y="175" text-anchor="middle" fill="#6b7280" font-size="10">+ App Code</text>
  
  <!-- Arrow 1 -->
  <line x1="160" y1="135" x2="200" y2="135" stroke="#4f46e5" stroke-width="2" stroke-dasharray="6,3">
    <animate attributeName="stroke-dashoffset" values="18;0" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <polygon points="200,130 210,135 200,140" fill="#4f46e5"/>
  
  <!-- Step 2: Build -->
  <rect x="210" y="70" width="130" height="130" fill="#1f2937" stroke="#f59e0b" stroke-width="2" rx="10">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="0.5s" repeatCount="indefinite"/>
  </rect>
  <text x="275" y="110" text-anchor="middle" fill="#fbbf24" font-size="28">🔨</text>
  <text x="275" y="140" text-anchor="middle" fill="#fcd34d" font-size="13" font-weight="bold">Build</text>
  <text x="275" y="160" text-anchor="middle" fill="#6b7280" font-size="10">docker build</text>
  <text x="275" y="175" text-anchor="middle" fill="#6b7280" font-size="10">Create Image</text>
  
  <!-- Arrow 2 -->
  <line x1="340" y1="135" x2="380" y2="135" stroke="#d97706" stroke-width="2" stroke-dasharray="6,3">
    <animate attributeName="stroke-dashoffset" values="18;0" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <polygon points="380,130 390,135 380,140" fill="#d97706"/>
  
  <!-- Step 3: Test -->
  <rect x="390" y="70" width="130" height="130" fill="#1f2937" stroke="#10b981" stroke-width="2" rx="10">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="1s" repeatCount="indefinite"/>
  </rect>
  <text x="455" y="110" text-anchor="middle" fill="#34d399" font-size="28">🧪</text>
  <text x="455" y="140" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="bold">Test</text>
  <text x="455" y="160" text-anchor="middle" fill="#6b7280" font-size="10">docker run</text>
  <text x="455" y="175" text-anchor="middle" fill="#6b7280" font-size="10">Verify Locally</text>
  
  <!-- Arrow 3 -->
  <line x1="520" y1="135" x2="560" y2="135" stroke="#059669" stroke-width="2" stroke-dasharray="6,3">
    <animate attributeName="stroke-dashoffset" values="18;0" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <polygon points="560,130 570,135 560,140" fill="#059669"/>
  
  <!-- Step 4: Push -->
  <rect x="570" y="70" width="130" height="130" fill="#1f2937" stroke="#3b82f6" stroke-width="2" rx="10">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </rect>
  <text x="635" y="110" text-anchor="middle" fill="#60a5fa" font-size="28">📤</text>
  <text x="635" y="140" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="bold">Ship</text>
  <text x="635" y="160" text-anchor="middle" fill="#6b7280" font-size="10">docker push</text>
  <text x="635" y="175" text-anchor="middle" fill="#6b7280" font-size="10">Registry / ECR</text>
  
  <!-- Arrow 4 -->
  <line x1="700" y1="135" x2="740" y2="135" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,3">
    <animate attributeName="stroke-dashoffset" values="18;0" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <polygon points="740,130 750,135 740,140" fill="#2563eb"/>
  
  <!-- Step 5: Deploy -->
  <rect x="750" y="70" width="130" height="130" fill="#1f2937" stroke="#ec4899" stroke-width="2" rx="10">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="2s" repeatCount="indefinite"/>
  </rect>
  <text x="815" y="110" text-anchor="middle" fill="#f472b6" font-size="28">🚀</text>
  <text x="815" y="140" text-anchor="middle" fill="#f9a8d4" font-size="13" font-weight="bold">Deploy</text>
  <text x="815" y="160" text-anchor="middle" fill="#6b7280" font-size="10">docker run</text>
  <text x="815" y="175" text-anchor="middle" fill="#6b7280" font-size="10">Production</text>
  
  <!-- Animated flowing dots -->
  <circle r="4" fill="#6366f1">
    <animateMotion dur="8s" repeatCount="indefinite" path="M95,200 L275,200 L455,200 L635,200 L815,200 L815,200"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#f59e0b">
    <animateMotion dur="8s" begin="2s" repeatCount="indefinite" path="M95,200 L275,200 L455,200 L635,200 L815,200"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Bottom label -->
  <text x="450" y="235" text-anchor="middle" fill="#4b5563" font-size="11">Continuous Integration / Continuous Deployment Pipeline</text>
</svg>
