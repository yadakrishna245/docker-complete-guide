<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" font-family="Arial, sans-serif">
  <rect width="900" height="310" fill="#0d1117" rx="12"/>
  <text x="450" y="30" text-anchor="middle" fill="#58a6ff" font-size="16" font-weight="bold">🖼️ Troubleshooting: Image Build Fails</text>

  <!-- Problem -->
  <rect x="350" y="45" width="200" height="35" fill="#1f2937" stroke="#ef4444" stroke-width="2" rx="8">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="450" y="67" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="bold">docker build fails</text>

  <!-- Five branches -->
  <line x1="370" y1="80" x2="95" y2="110" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,2">
    <animate attributeName="stroke-dashoffset" values="12;0" dur="0.6s" repeatCount="indefinite"/>
  </line>
  <line x1="400" y1="80" x2="275" y2="110" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,2">
    <animate attributeName="stroke-dashoffset" values="12;0" dur="0.6s" repeatCount="indefinite"/>
  </line>
  <line x1="450" y1="80" x2="450" y2="110" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,2">
    <animate attributeName="stroke-dashoffset" values="12;0" dur="0.6s" repeatCount="indefinite"/>
  </line>
  <line x1="500" y1="80" x2="630" y2="110" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,2">
    <animate attributeName="stroke-dashoffset" values="12;0" dur="0.6s" repeatCount="indefinite"/>
  </line>
  <line x1="530" y1="80" x2="810" y2="110" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,2">
    <animate attributeName="stroke-dashoffset" values="12;0" dur="0.6s" repeatCount="indefinite"/>
  </line>

  <!-- Branch 1: COPY/ADD fails -->
  <rect x="20" y="110" width="150" height="35" fill="#1f2937" stroke="#3b82f6" stroke-width="2" rx="8"/>
  <text x="95" y="132" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="bold">COPY/ADD fails</text>
  <line x1="95" y1="145" x2="95" y2="165" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="20" y="168" width="150" height="50" fill="#1f2937" stroke="#10b981" stroke-width="1.5" rx="6"/>
  <text x="95" y="186" text-anchor="middle" fill="#6ee7b7" font-size="9" font-weight="bold">Fix:</text>
  <text x="95" y="200" text-anchor="middle" fill="#6b7280" font-size="8">Check .dockerignore</text>
  <text x="95" y="212" text-anchor="middle" fill="#6b7280" font-size="8">Check relative paths</text>

  <!-- Branch 2: RUN fails -->
  <rect x="195" y="110" width="160" height="35" fill="#1f2937" stroke="#f59e0b" stroke-width="2" rx="8"/>
  <text x="275" y="132" text-anchor="middle" fill="#fcd34d" font-size="10" font-weight="bold">RUN command fails</text>
  <line x1="275" y1="145" x2="275" y2="165" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="190" y="168" width="170" height="65" fill="#1f2937" stroke="#10b981" stroke-width="1.5" rx="6"/>
  <text x="275" y="185" text-anchor="middle" fill="#6ee7b7" font-size="9" font-weight="bold">Check error type:</text>
  <text x="275" y="200" text-anchor="middle" fill="#6b7280" font-size="8">Pkg not found → wrong base</text>
  <text x="275" y="213" text-anchor="middle" fill="#6b7280" font-size="8">Permission → USER root</text>
  <text x="275" y="226" text-anchor="middle" fill="#6b7280" font-size="8">Network → --network host</text>

  <!-- Branch 3: FROM fails -->
  <rect x="380" y="110" width="140" height="35" fill="#1f2937" stroke="#8b5cf6" stroke-width="2" rx="8"/>
  <text x="450" y="132" text-anchor="middle" fill="#a78bfa" font-size="10" font-weight="bold">FROM fails</text>
  <line x1="450" y1="145" x2="450" y2="165" stroke="#8b5cf6" stroke-width="1.5"/>
  <rect x="380" y="168" width="140" height="50" fill="#1f2937" stroke="#10b981" stroke-width="1.5" rx="6"/>
  <text x="450" y="186" text-anchor="middle" fill="#6ee7b7" font-size="9" font-weight="bold">Fix:</text>
  <text x="450" y="200" text-anchor="middle" fill="#6b7280" font-size="8">Check image name/tag</text>
  <text x="450" y="212" text-anchor="middle" fill="#6b7280" font-size="8">docker pull manually</text>

  <!-- Branch 4: Out of space -->
  <rect x="545" y="110" width="165" height="35" fill="#1f2937" stroke="#ef4444" stroke-width="2" rx="8"/>
  <text x="628" y="132" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="bold">Out of disk space</text>
  <line x1="628" y1="145" x2="628" y2="165" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="553" y="168" width="150" height="50" fill="#1f2937" stroke="#10b981" stroke-width="1.5" rx="6"/>
  <text x="628" y="186" text-anchor="middle" fill="#6ee7b7" font-size="9" font-weight="bold">Fix:</text>
  <text x="628" y="200" text-anchor="middle" fill="#6b7280" font-size="8">docker system prune -a</text>
  <text x="628" y="212" text-anchor="middle" fill="#6b7280" font-size="8">Increase disk space</text>

  <!-- Branch 5: Very slow -->
  <rect x="735" y="110" width="140" height="35" fill="#1f2937" stroke="#06b6d4" stroke-width="2" rx="8"/>
  <text x="805" y="132" text-anchor="middle" fill="#22d3ee" font-size="10" font-weight="bold">Build very slow</text>
  <line x1="805" y1="145" x2="805" y2="165" stroke="#06b6d4" stroke-width="1.5"/>
  <rect x="735" y="168" width="145" height="50" fill="#1f2937" stroke="#10b981" stroke-width="1.5" rx="6"/>
  <text x="808" y="186" text-anchor="middle" fill="#6ee7b7" font-size="9" font-weight="bold">Fix: Layer caching</text>
  <text x="808" y="200" text-anchor="middle" fill="#6b7280" font-size="8">COPY package*.json first</text>
  <text x="808" y="212" text-anchor="middle" fill="#6b7280" font-size="8">THEN COPY . .</text>

  <!-- Tips -->
  <rect x="100" y="255" width="700" height="30" fill="#1f2937" stroke="#30363d" stroke-width="1" rx="6"/>
  <text x="450" y="274" text-anchor="middle" fill="#9ca3af" font-size="9">Pro tip: docker build --progress=plain -t myapp . | docker build --no-cache -t myapp .</text>

  <text x="450" y="303" text-anchor="middle" fill="#4b5563" font-size="10">💡 Order Dockerfile instructions: least-changing first → most-changing last</text>
</svg>
