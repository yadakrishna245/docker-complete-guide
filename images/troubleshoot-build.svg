<svg fill="none" viewBox="0 0 900 280" width="900" height="280" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes pulseRed { 0%,100%{border-color:#dc2626} 50%{border-color:#991b1b} }
        @keyframes pulseGreen { 0%,100%{border-color:#16a34a} 50%{border-color:#166534} }
        .wrap{background:#0d1117;padding:16px;font-family:Arial,sans-serif;color:#e5e7eb;display:flex;flex-direction:column;gap:10px;align-items:center;min-height:248px}
        .problem{background:#1f2937;border:2px solid #dc2626;border-radius:8px;padding:8px 16px;animation:pulseRed 2s infinite;font-weight:bold;font-size:14px}
        .card{background:#1f2937;border:1px solid #374151;border-radius:8px;padding:8px 12px;font-size:12px;text-align:center}
        .solution{background:#1f2937;border:2px solid #16a34a;border-radius:8px;padding:6px 10px;font-size:11px;animation:pulseGreen 2s infinite;text-align:center}
        .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
        .arrow{color:#6b7280;font-size:14px}
        .code{background:#374151;border-radius:4px;padding:2px 6px;font-family:monospace;font-size:11px;color:#60a5fa}
        .col{display:flex;flex-direction:column;gap:6px;align-items:center}
      </style>
      <div class="wrap">
        <div class="problem">🔨 Build Fails</div>
        <div class="arrow">↓ Which step fails?</div>
        <div class="row">
          <div class="col">
            <div class="card"><b>COPY fails</b></div>
            <div class="arrow">↓</div>
            <div class="solution">Check<br/><span class="code">.dockerignore</span><br/>File exists?</div>
          </div>
          <div class="col">
            <div class="card"><b>RUN fails</b></div>
            <div class="arrow">↓</div>
            <div class="solution">Wrong package?<br/>Permissions?<br/>Network in build?</div>
          </div>
          <div class="col">
            <div class="card"><b>FROM fails</b></div>
            <div class="arrow">↓</div>
            <div class="solution">Check image name<br/><span class="code">docker pull</span><br/>manually</div>
          </div>
          <div class="col">
            <div class="card"><b>Out of Space</b></div>
            <div class="arrow">↓</div>
            <div class="solution"><span class="code">docker system<br/>prune</span></div>
          </div>
          <div class="col">
            <div class="card"><b>Very Slow</b></div>
            <div class="arrow">↓</div>
            <div class="solution">Use layer caching<br/>Order: deps first<br/>code last</div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
