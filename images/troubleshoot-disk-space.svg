<svg fill="none" viewBox="0 0 900 290" width="900" height="290" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes pulseRed { 0%,100%{border-color:#dc2626} 50%{border-color:#991b1b} }
        @keyframes pulseGreen { 0%,100%{border-color:#16a34a} 50%{border-color:#166534} }
        @keyframes pulseWarn { 0%,100%{border-color:#f59e0b} 50%{border-color:#d97706} }
        .wrap{background:#0d1117;padding:16px;font-family:Arial,sans-serif;color:#e5e7eb;display:flex;flex-direction:column;gap:10px;align-items:center;min-height:258px}
        .problem{background:#1f2937;border:2px solid #dc2626;border-radius:8px;padding:8px 16px;animation:pulseRed 2s infinite;font-weight:bold;font-size:14px}
        .card{background:#1f2937;border:1px solid #374151;border-radius:8px;padding:8px 12px;font-size:12px;text-align:center}
        .solution{background:#1f2937;border:2px solid #16a34a;border-radius:8px;padding:6px 10px;font-size:11px;animation:pulseGreen 2s infinite;text-align:center}
        .danger{background:#1f2937;border:2px solid #dc2626;border-radius:8px;padding:6px 10px;font-size:11px;animation:pulseRed 2s infinite;text-align:center}
        .warn-box{background:#1f2937;border:2px solid #f59e0b;border-radius:8px;padding:6px 10px;font-size:11px;animation:pulseWarn 2s infinite;text-align:center}
        .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
        .arrow{color:#6b7280;font-size:14px}
        .code{background:#374151;border-radius:4px;padding:2px 6px;font-family:monospace;font-size:11px;color:#60a5fa}
        .col{display:flex;flex-direction:column;gap:6px;align-items:center}
      </style>
      <div class="wrap">
        <div class="problem">💽 Disk Full</div>
        <div class="arrow">↓</div>
        <div class="card"><span class="code">docker system df</span> — See what's using space</div>
        <div class="arrow">↓ Cleanup Options</div>
        <div class="row">
          <div class="col">
            <div class="solution"><b>Images</b><br/><span class="code">docker image prune -a</span><br/>Remove unused</div>
          </div>
          <div class="col">
            <div class="solution"><b>Containers</b><br/><span class="code">docker container prune</span><br/>Remove stopped</div>
          </div>
          <div class="col">
            <div class="warn-box"><b>Volumes ⚠️</b><br/><span class="code">docker volume prune</span><br/>Data loss risk!</div>
          </div>
          <div class="col">
            <div class="solution"><b>Build Cache</b><br/><span class="code">docker builder prune</span><br/>Safe to clear</div>
          </div>
        </div>
        <div class="arrow">↓ Still full?</div>
        <div class="danger">☢️ Nuclear Option: <span class="code">docker system prune -a --volumes</span><br/>Removes EVERYTHING unused — containers, images, volumes, cache</div>
      </div>
    </div>
  </foreignObject>
</svg>
