<svg fill="none" viewBox="0 0 900 330" width="900" height="330" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes pulseGold { 0%,100%{border-color:#eab308} 50%{border-color:#ca8a04} }
        @keyframes pulseBlue { 0%,100%{border-color:#3b82f6} 50%{border-color:#1d4ed8} }
        .wrap{background:#0d1117;font-family:Arial,sans-serif;color:#e5e7eb;padding:12px;box-sizing:border-box;width:900px;height:330px;display:flex;flex-direction:column;gap:10px}
        .title{text-align:center;font-size:14px;font-weight:bold;color:#eab308}
        .row{display:flex;gap:14px;justify-content:center}
        .manager{background:#1f2937;border:2px solid #eab308;animation:pulseGold 3s infinite;border-radius:10px;padding:12px 20px;text-align:center;min-width:160px}
        .worker{background:#1f2937;border:2px solid #3b82f6;animation:pulseBlue 3s infinite;border-radius:10px;padding:12px 20px;text-align:center;min-width:160px}
        .node-title{font-size:12px;font-weight:bold;margin-bottom:4px}
        .leader-badge{color:#eab308;font-size:11px}
        .connections{text-align:center;font-size:11px;color:#9ca3af}
        .dash{border-top:2px dashed #6b7280;margin:0 auto;width:60%}
        .arrows-down{text-align:center;font-size:14px;color:#eab308}
        .features{display:flex;gap:10px;justify-content:center;margin-top:auto}
        .feature{background:#374151;border-radius:6px;padding:8px 14px;font-size:11px;text-align:center}
        .whale{font-size:18px}
      </style>
      <div class="wrap">
        <div class="title">🐳 Docker Swarm Cluster</div>
        <div class="row">
          <div class="manager">
            <div class="node-title">👑 Manager 1</div>
            <div class="leader-badge">⭐ LEADER</div>
          </div>
          <div class="manager">
            <div class="node-title">🔧 Manager 2</div>
            <div style="font-size:10px;color:#9ca3af">Reachable</div>
          </div>
          <div class="manager">
            <div class="node-title">🔧 Manager 3</div>
            <div style="font-size:10px;color:#9ca3af">Reachable</div>
          </div>
        </div>
        <div class="connections">
          <div class="dash"></div>
          - - - Raft Consensus - - -
        </div>
        <div class="arrows-down">↓ &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ↓ &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ↓</div>
        <div class="row">
          <div class="worker">
            <div class="whale">🐋</div>
            <div class="node-title">Worker 1</div>
          </div>
          <div class="worker">
            <div class="whale">🐋</div>
            <div class="node-title">Worker 2</div>
          </div>
          <div class="worker">
            <div class="whale">🐋</div>
            <div class="node-title">Worker 3</div>
          </div>
        </div>
        <div class="features">
          <div class="feature">⚖️ Load Balancing</div>
          <div class="feature">🔄 Rolling Updates</div>
          <div class="feature">💚 Self-Healing</div>
          <div class="feature">🔐 Secrets</div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
