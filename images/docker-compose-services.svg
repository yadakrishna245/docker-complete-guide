<svg fill="none" viewBox="0 0 900 380" width="900" height="380" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes pulseBlue { 0%,100%{border-color:#3b82f6} 50%{border-color:#60a5fa} }
        @keyframes pulseGreen { 0%,100%{border-color:#10b981} 50%{border-color:#34d399} }
        @keyframes pulseYellow { 0%,100%{border-color:#f59e0b} 50%{border-color:#fbbf24} }
        @keyframes pulseRed { 0%,100%{border-color:#ef4444} 50%{border-color:#f87171} }
        @keyframes pulsePurple { 0%,100%{border-color:#8b5cf6} 50%{border-color:#a78bfa} }
        .wrap{background:#0d1117;padding:16px;font-family:Arial,sans-serif;color:#e5e7eb;display:flex;flex-direction:column;align-items:center;height:348px;box-sizing:border-box;gap:12px}
        .title{font-size:16px;font-weight:bold;color:#fff}
        .compose-file{background:#1f2937;border:3px solid;border-radius:10px;padding:10px 24px;font-size:13px;font-weight:bold;animation:pulsePurple 2s infinite}
        .services{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
        .svc{background:#1f2937;border:3px solid;border-radius:10px;padding:12px 14px;min-width:150px;text-align:center}
        .svc .icon{font-size:20px;margin-bottom:4px}
        .svc .name{font-size:13px;font-weight:bold}
        .svc .image{font-size:10px;color:#9ca3af;margin-top:2px}
        .svc .port{font-size:11px;margin-top:4px;background:#374151;border-radius:4px;padding:2px 6px;display:inline-block}
        .blue{animation:pulseBlue 2s infinite}
        .green{animation:pulseGreen 2s infinite}
        .yellow{animation:pulseYellow 2s infinite}
        .red{animation:pulseRed 2s infinite}
        .deps{display:flex;gap:16px;align-items:center;font-size:11px;color:#9ca3af;flex-wrap:wrap;justify-content:center}
        .dep-arrow{background:#374151;padding:3px 8px;border-radius:4px;font-size:10px}
        .volume{background:#1f2937;border:2px dashed #6b7280;border-radius:8px;padding:8px 16px;font-size:12px;display:flex;align-items:center;gap:6px}
      </style>
      <div class="wrap">
        <div class="title">🐙 Docker Compose Services</div>
        <div class="compose-file">📄 docker-compose.yml</div>
        <div class="services">
          <div class="svc blue">
            <div class="icon">🌐</div>
            <div class="name">web</div>
            <div class="image">nginx:alpine</div>
            <div class="port">:8080</div>
          </div>
          <div class="svc green">
            <div class="icon">⚙️</div>
            <div class="name">api</div>
            <div class="image">node:18-alpine</div>
            <div class="port">:3000</div>
          </div>
          <div class="svc yellow">
            <div class="icon">🗄️</div>
            <div class="name">db</div>
            <div class="image">postgres:15</div>
            <div class="port">:5432</div>
          </div>
          <div class="svc red">
            <div class="icon">⚡</div>
            <div class="name">redis</div>
            <div class="image">redis:7-alpine</div>
            <div class="port">:6379</div>
          </div>
        </div>
        <div class="deps">
          <span class="dep-arrow">web → depends_on → api</span>
          <span class="dep-arrow">api → depends_on → db, redis</span>
        </div>
        <div class="volume">💾 postgres_data (persistent volume → db)</div>
      </div>
    </div>
  </foreignObject>
</svg>
