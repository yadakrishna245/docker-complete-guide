<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Arial, sans-serif">
  <rect width="900" height="380" fill="#0d1117" rx="12"/>
  <text x="450" y="30" text-anchor="middle" fill="#58a6ff" font-size="16" font-weight="bold">Docker Compose: Multi-Service Architecture</text>

  <!-- docker-compose.yml box -->
  <rect x="350" y="45" width="200" height="45" fill="#1f2937" stroke="#8b5cf6" stroke-width="2" rx="10">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="450" y="73" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="bold">📄 docker-compose.yml</text>

  <!-- Arrows from compose to services -->
  <line x1="370" y1="90" x2="130" y2="140" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5,3">
    <animate attributeName="stroke-dashoffset" values="16;0" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <line x1="410" y1="90" x2="330" y2="140" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5,3">
    <animate attributeName="stroke-dashoffset" values="16;0" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <line x1="490" y1="90" x2="570" y2="140" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5,3">
    <animate attributeName="stroke-dashoffset" values="16;0" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <line x1="530" y1="90" x2="770" y2="140" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5,3">
    <animate attributeName="stroke-dashoffset" values="16;0" dur="0.8s" repeatCount="indefinite"/>
  </line>

  <!-- Web Service -->
  <rect x="50" y="140" width="160" height="90" fill="#1f2937" stroke="#3b82f6" stroke-width="2" rx="10">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="0.3s" repeatCount="indefinite"/>
  </rect>
  <text x="130" y="165" text-anchor="middle" fill="#60a5fa" font-size="18">🌐</text>
  <text x="130" y="185" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="bold">web</text>
  <text x="130" y="200" text-anchor="middle" fill="#6b7280" font-size="10">nginx:latest</text>
  <text x="130" y="215" text-anchor="middle" fill="#6b7280" font-size="10">Port 8080</text>

  <!-- API Service -->
  <rect x="250" y="140" width="160" height="90" fill="#1f2937" stroke="#10b981" stroke-width="2" rx="10">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="0.6s" repeatCount="indefinite"/>
  </rect>
  <text x="330" y="165" text-anchor="middle" fill="#34d399" font-size="18">⚙️</text>
  <text x="330" y="185" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="bold">api</text>
  <text x="330" y="200" text-anchor="middle" fill="#6b7280" font-size="10">node:18</text>
  <text x="330" y="215" text-anchor="middle" fill="#6b7280" font-size="10">Port 3000</text>

  <!-- DB Service -->
  <rect x="490" y="140" width="160" height="90" fill="#1f2937" stroke="#f59e0b" stroke-width="2" rx="10">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="0.9s" repeatCount="indefinite"/>
  </rect>
  <text x="570" y="165" text-anchor="middle" fill="#fbbf24" font-size="18">🗄️</text>
  <text x="570" y="185" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="bold">db</text>
  <text x="570" y="200" text-anchor="middle" fill="#6b7280" font-size="10">postgres:15</text>
  <text x="570" y="215" text-anchor="middle" fill="#6b7280" font-size="10">Port 5432</text>

  <!-- Redis Service -->
  <rect x="690" y="140" width="160" height="90" fill="#1f2937" stroke="#ef4444" stroke-width="2" rx="10">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="1.2s" repeatCount="indefinite"/>
  </rect>
  <text x="770" y="165" text-anchor="middle" fill="#f87171" font-size="18">📦</text>
  <text x="770" y="185" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="bold">redis</text>
  <text x="770" y="200" text-anchor="middle" fill="#6b7280" font-size="10">redis:7-alpine</text>
  <text x="770" y="215" text-anchor="middle" fill="#6b7280" font-size="10">Port 6379</text>

  <!-- Dependency arrows -->
  <line x1="170" y1="250" x2="260" y2="250" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,2">
    <animate attributeName="stroke-dashoffset" values="12;0" dur="0.6s" repeatCount="indefinite"/>
  </line>
  <polygon points="258,246 266,250 258,254" fill="#3b82f6"/>
  <text x="215" y="265" text-anchor="middle" fill="#9ca3af" font-size="9">depends_on</text>

  <line x1="410" y1="210" x2="490" y2="195" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,2">
    <animate attributeName="stroke-dashoffset" values="12;0" dur="0.6s" repeatCount="indefinite"/>
  </line>
  <polygon points="488,191 496,194 489,198" fill="#10b981"/>
  <text x="450" y="215" fill="#9ca3af" font-size="9">depends_on</text>

  <line x1="410" y1="220" x2="690" y2="195" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,2">
    <animate attributeName="stroke-dashoffset" values="12;0" dur="0.6s" repeatCount="indefinite"/>
  </line>
  <polygon points="688,191 696,194 689,198" fill="#10b981"/>
  <text x="560" y="240" fill="#9ca3af" font-size="9">depends_on</text>

  <!-- Volume -->
  <line x1="570" y1="230" x2="570" y2="290" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,2">
    <animate attributeName="stroke-dashoffset" values="12;0" dur="0.6s" repeatCount="indefinite"/>
  </line>
  <polygon points="565,290 570,298 575,290" fill="#f59e0b"/>
  <rect x="500" y="300" width="140" height="45" fill="#1f2937" stroke="#f59e0b" stroke-width="1.5" rx="8"/>
  <text x="570" y="320" text-anchor="middle" fill="#fbbf24" font-size="11">💾 postgres_data</text>
  <text x="570" y="336" text-anchor="middle" fill="#6b7280" font-size="9">Named Volume</text>

  <text x="450" y="370" text-anchor="middle" fill="#4b5563" font-size="10">docker-compose up -d | All services start with a single command</text>
</svg>
