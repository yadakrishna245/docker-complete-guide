<svg fill="none" viewBox="0 0 900 380" width="900" height="380" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes pulseGreen { 0%,100%{border-color:#22c55e} 50%{border-color:#16a34a} }
        @keyframes pulseBlue { 0%,100%{border-color:#3b82f6} 50%{border-color:#1d4ed8} }
        @keyframes pulseOrange { 0%,100%{border-color:#f97316} 50%{border-color:#ea580c} }
        .wrap{background:#0d1117;font-family:Arial,sans-serif;color:#e5e7eb;padding:12px;box-sizing:border-box;width:900px;height:380px;display:flex;flex-direction:column;gap:8px}
        .cloud{background:#1f2937;border:2px dashed #9ca3af;border-radius:20px;padding:6px 16px;text-align:center;font-size:12px;align-self:center}
        .arrow-down{text-align:center;font-size:11px;color:#f97316}
        .host-box{border:2px solid #6b7280;border-radius:8px;padding:8px;background:#1f2937;flex:1;display:flex;flex-direction:column;gap:8px}
        .host-label{font-size:13px;font-weight:bold;color:#9ca3af;text-align:center}
        .networks{display:flex;gap:10px;flex:1}
        .network{border:2px solid;border-radius:8px;padding:8px;flex:1;display:flex;flex-direction:column;gap:6px}
        .custom{border-color:#22c55e;animation:pulseGreen 3s infinite;background:#0d1117}
        .bridge{border-color:#3b82f6;animation:pulseBlue 3s infinite;background:#0d1117}
        .net-title{font-size:11px;font-weight:bold;text-align:center}
        .containers{display:flex;gap:6px;justify-content:center}
        .container{background:#374151;border-radius:6px;padding:6px 10px;font-size:10px;text-align:center}
        .conn{text-align:center;font-size:10px;margin-top:4px}
        .conn-dns{color:#22c55e}
        .conn-no{color:#ef4444;border-top:1px dashed #ef4444;padding-top:3px;margin:0 10px}
        .bottom-row{display:flex;gap:8px;justify-content:center}
        .net-type{background:#374151;border:1px solid #6b7280;border-radius:6px;padding:5px 12px;font-size:10px;text-align:center}
      </style>
      <div class="wrap">
        <div class="cloud">☁️ Internet</div>
        <div class="arrow-down">↓ Port mapping (-p 8080:80)</div>
        <div class="host-box">
          <div class="host-label">🐳 Docker Host</div>
          <div class="networks">
            <div class="network custom">
              <div class="net-title" style="color:#22c55e">Custom Network</div>
              <div class="containers">
                <div class="container">📦 Container3<br/><span style="color:#22c55e">app</span></div>
                <div class="container">📦 Container4<br/><span style="color:#22c55e">db</span></div>
              </div>
              <div class="conn conn-dns">← DNS by name →</div>
            </div>
            <div class="network bridge">
              <div class="net-title" style="color:#3b82f6">Bridge Network (default)</div>
              <div class="containers">
                <div class="container">📦 Container1</div>
                <div class="container">📦 Container2</div>
              </div>
              <div class="conn conn-no">✗ No DNS resolution</div>
            </div>
          </div>
        </div>
        <div class="bottom-row">
          <div class="net-type">🌐 <strong>host</strong><br/>No isolation</div>
          <div class="net-type">🚫 <strong>none</strong><br/>No network</div>
          <div class="net-type">🔗 <strong>overlay</strong><br/>Multi-host (Swarm)</div>
          <div class="net-type">📡 <strong>macvlan</strong><br/>Physical MAC</div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
