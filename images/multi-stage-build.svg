<svg fill="none" viewBox="0 0 900 250" width="900" height="250" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes pulseRed { 0%,100%{border-color:#ef4444} 50%{border-color:#f87171} }
        @keyframes pulseGreen { 0%,100%{border-color:#10b981} 50%{border-color:#34d399} }
        .wrap{background:#0d1117;padding:16px;font-family:Arial,sans-serif;color:#e5e7eb;display:flex;flex-direction:column;align-items:center;height:218px;box-sizing:border-box}
        .title{font-size:16px;font-weight:bold;margin-bottom:12px;color:#fff}
        .stages{display:flex;align-items:center;gap:16px}
        .stage{background:#1f2937;border:3px solid;border-radius:12px;padding:14px 18px;min-width:240px}
        .stage-title{font-size:14px;font-weight:bold;margin-bottom:8px}
        .stage-detail{font-size:11px;color:#9ca3af;margin:4px 0}
        .inner{background:#374151;border-radius:6px;padding:6px 10px;margin-top:6px;font-size:11px}
        .red{animation:pulseRed 2s infinite}
        .green{animation:pulseGreen 2s infinite}
        .arrow-mid{display:flex;flex-direction:column;align-items:center;gap:2px;color:#9ca3af}
        .arrow-mid .sym{font-size:20px}
        .arrow-mid .cmd{font-size:9px;background:#374151;padding:2px 6px;border-radius:4px;text-align:center;white-space:nowrap}
        .result{margin-top:12px;display:flex;align-items:center;gap:8px;font-size:13px}
        .result .check{color:#10b981;font-size:18px}
        .size-bad{color:#ef4444}
        .size-good{color:#10b981}
      </style>
      <div class="wrap">
        <div class="title">🏗️ Multi-Stage Build</div>
        <div class="stages">
          <div class="stage red">
            <div class="stage-title">📦 Stage 1: Builder</div>
            <div class="stage-detail">FROM node:18 <span class="size-bad">(~900MB)</span></div>
            <div class="inner">npm install + npm run build</div>
          </div>
          <div class="arrow-mid">
            <span class="cmd">COPY --from=builder</span>
            <span class="sym">→</span>
          </div>
          <div class="stage green">
            <div class="stage-title">🚀 Stage 2: Production</div>
            <div class="stage-detail">FROM node:18-alpine <span class="size-good">(~130MB)</span></div>
            <div class="inner">Only built output + production deps</div>
          </div>
        </div>
        <div class="result">
          <span class="check">✅</span>
          <span>Final Image: <strong class="size-good">~150MB</strong> (vs 900MB without multi-stage)</span>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
