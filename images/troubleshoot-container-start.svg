<svg fill="none" viewBox="0 0 900 380" width="900" height="380" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes pulseRed { 0%,100%{border-color:#dc2626} 50%{border-color:#991b1b} }
        @keyframes pulseGreen { 0%,100%{border-color:#16a34a} 50%{border-color:#166534} }
        .wrap{background:#0d1117;padding:16px;font-family:Arial,sans-serif;color:#e5e7eb;display:flex;flex-direction:column;gap:10px;align-items:center;min-height:348px}
        .problem{background:#1f2937;border:2px solid #dc2626;border-radius:8px;padding:8px 16px;animation:pulseRed 2s infinite;font-weight:bold;font-size:14px}
        .card{background:#1f2937;border:1px solid #374151;border-radius:8px;padding:8px 12px;font-size:12px;text-align:center}
        .solution{background:#1f2937;border:2px solid #16a34a;border-radius:8px;padding:8px 12px;font-size:11px;animation:pulseGreen 2s infinite}
        .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
        .arrow{color:#6b7280;font-size:14px}
        .code{background:#374151;border-radius:4px;padding:2px 6px;font-family:monospace;font-size:11px;color:#60a5fa}
        .exit-box{background:#374151;border-radius:6px;padding:6px 10px;font-size:11px;text-align:center;min-width:70px}
        .warn{color:#f59e0b}
        .col{display:flex;flex-direction:column;gap:6px;align-items:center}
      </style>
      <div class="wrap">
        <div class="problem">❌ Container Won't Start</div>
        <div class="arrow">↓</div>
        <div class="card"><span class="code">docker ps -a</span> — Check container status</div>
        <div class="arrow">↓</div>
        <div class="row">
          <div class="col">
            <div class="card"><b>Status: Created</b><br/>Never started</div>
            <div class="arrow">↓</div>
            <div class="solution"><span class="code">docker logs &lt;id&gt;</span><br/>Check for config errors</div>
          </div>
          <div class="col">
            <div class="card"><b>Status: Exited</b><br/>Started then stopped</div>
            <div class="arrow">↓</div>
            <div class="solution"><span class="code">docker inspect &lt;id&gt;</span><br/>Check exit code</div>
          </div>
        </div>
        <div class="arrow">↓ Exit Codes Reference</div>
        <div class="row">
          <div class="exit-box"><b>0</b><br/>OK</div>
          <div class="exit-box"><b>1</b><br/>App Error</div>
          <div class="exit-box"><b>125</b><br/>Daemon</div>
          <div class="exit-box"><b>126</b><br/>Perms</div>
          <div class="exit-box"><b>127</b><br/>Not Found</div>
          <div class="exit-box"><b>137</b><br/><span class="warn">OOM ⚠️</span></div>
          <div class="exit-box"><b>143</b><br/>SIGTERM</div>
        </div>
        <div class="row" style="margin-top:4px">
          <div class="solution">Quick Fix: <span class="code">docker logs &lt;id&gt;</span> → <span class="code">docker rm &lt;id&gt;</span> → Fix issue → <span class="code">docker run</span> again</div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
