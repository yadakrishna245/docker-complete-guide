<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" font-family="Arial, sans-serif">
  <!-- Background -->
  <rect width="900" height="350" fill="#0d1117" rx="12"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" fill="#58a6ff" font-size="16" font-weight="bold">Containers vs Virtual Machines</text>
  
  <!-- === DOCKER SIDE === -->
  <text x="225" y="60" text-anchor="middle" fill="#34d399" font-size="14" font-weight="bold">🐳 Docker Containers</text>
  
  <!-- Infrastructure -->
  <rect x="50" y="290" width="350" height="40" fill="#374151" stroke="#6b7280" stroke-width="1" rx="5"/>
  <text x="225" y="315" text-anchor="middle" fill="#d1d5db" font-size="12">Infrastructure (Hardware)</text>
  
  <!-- Host OS -->
  <rect x="50" y="245" width="350" height="40" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1" rx="5"/>
  <text x="225" y="270" text-anchor="middle" fill="#93c5fd" font-size="12">Host Operating System</text>
  
  <!-- Docker Engine -->
  <rect x="50" y="200" width="350" height="40" fill="#1a3a2a" stroke="#10b981" stroke-width="2" rx="5">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="225" y="225" text-anchor="middle" fill="#34d399" font-size="12" font-weight="bold">🐳 Docker Engine</text>
  
  <!-- Containers -->
  <rect x="60" y="80" width="100" height="110" fill="#1f2937" stroke="#f59e0b" stroke-width="2" rx="5">
    <animate attributeName="y" values="80;77;80" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="110" y="105" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="bold">App 1</text>
  <rect x="70" y="115" width="80" height="15" fill="#374151" rx="3"/>
  <text x="110" y="126" text-anchor="middle" fill="#9ca3af" font-size="8">Bins/Libs</text>
  <rect x="70" y="135" width="80" height="15" fill="#374151" rx="3"/>
  <text x="110" y="146" text-anchor="middle" fill="#9ca3af" font-size="8">Dependencies</text>
  <text x="110" y="175" text-anchor="middle" fill="#6b7280" font-size="9">~50MB</text>
  
  <rect x="175" y="80" width="100" height="110" fill="#1f2937" stroke="#f59e0b" stroke-width="2" rx="5">
    <animate attributeName="y" values="80;77;80" dur="3s" begin="0.5s" repeatCount="indefinite"/>
  </rect>
  <text x="225" y="105" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="bold">App 2</text>
  <rect x="185" y="115" width="80" height="15" fill="#374151" rx="3"/>
  <text x="225" y="126" text-anchor="middle" fill="#9ca3af" font-size="8">Bins/Libs</text>
  <rect x="185" y="135" width="80" height="15" fill="#374151" rx="3"/>
  <text x="225" y="146" text-anchor="middle" fill="#9ca3af" font-size="8">Dependencies</text>
  <text x="225" y="175" text-anchor="middle" fill="#6b7280" font-size="9">~50MB</text>
  
  <rect x="290" y="80" width="100" height="110" fill="#1f2937" stroke="#f59e0b" stroke-width="2" rx="5">
    <animate attributeName="y" values="80;77;80" dur="3s" begin="1s" repeatCount="indefinite"/>
  </rect>
  <text x="340" y="105" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="bold">App 3</text>
  <rect x="300" y="115" width="80" height="15" fill="#374151" rx="3"/>
  <text x="340" y="126" text-anchor="middle" fill="#9ca3af" font-size="8">Bins/Libs</text>
  <rect x="300" y="135" width="80" height="15" fill="#374151" rx="3"/>
  <text x="340" y="146" text-anchor="middle" fill="#9ca3af" font-size="8">Dependencies</text>
  <text x="340" y="175" text-anchor="middle" fill="#6b7280" font-size="9">~50MB</text>
  
  <!-- Divider -->
  <line x1="450" y1="50" x2="450" y2="340" stroke="#374151" stroke-width="1" stroke-dasharray="4,4"/>
  
  <!-- === VM SIDE === -->
  <text x="675" y="60" text-anchor="middle" fill="#f87171" font-size="14" font-weight="bold">💻 Virtual Machines</text>
  
  <!-- Infrastructure -->
  <rect x="500" y="290" width="350" height="40" fill="#374151" stroke="#6b7280" stroke-width="1" rx="5"/>
  <text x="675" y="315" text-anchor="middle" fill="#d1d5db" font-size="12">Infrastructure (Hardware)</text>
  
  <!-- Hypervisor -->
  <rect x="500" y="245" width="350" height="40" fill="#3b1f1f" stroke="#ef4444" stroke-width="2" rx="5">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="675" y="270" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="bold">Hypervisor (VMware / KVM)</text>
  
  <!-- VMs -->
  <rect x="510" y="80" width="100" height="155" fill="#1f2937" stroke="#ef4444" stroke-width="2" rx="5"/>
  <text x="560" y="100" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="bold">App 1</text>
  <rect x="520" y="108" width="80" height="15" fill="#374151" rx="3"/>
  <text x="560" y="119" text-anchor="middle" fill="#9ca3af" font-size="8">Bins/Libs</text>
  <rect x="520" y="128" width="80" height="30" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1" rx="3"/>
  <text x="560" y="147" text-anchor="middle" fill="#93c5fd" font-size="8">Guest OS</text>
  <text x="560" y="175" text-anchor="middle" fill="#ef4444" font-size="9" font-weight="bold">~1GB+</text>
  
  <rect x="625" y="80" width="100" height="155" fill="#1f2937" stroke="#ef4444" stroke-width="2" rx="5"/>
  <text x="675" y="100" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="bold">App 2</text>
  <rect x="635" y="108" width="80" height="15" fill="#374151" rx="3"/>
  <text x="675" y="119" text-anchor="middle" fill="#9ca3af" font-size="8">Bins/Libs</text>
  <rect x="635" y="128" width="80" height="30" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1" rx="3"/>
  <text x="675" y="147" text-anchor="middle" fill="#93c5fd" font-size="8">Guest OS</text>
  <text x="675" y="175" text-anchor="middle" fill="#ef4444" font-size="9" font-weight="bold">~1GB+</text>
  
  <rect x="740" y="80" width="100" height="155" fill="#1f2937" stroke="#ef4444" stroke-width="2" rx="5"/>
  <text x="790" y="100" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="bold">App 3</text>
  <rect x="750" y="108" width="80" height="15" fill="#374151" rx="3"/>
  <text x="790" y="119" text-anchor="middle" fill="#9ca3af" font-size="8">Bins/Libs</text>
  <rect x="750" y="128" width="80" height="30" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1" rx="3"/>
  <text x="790" y="147" text-anchor="middle" fill="#93c5fd" font-size="8">Guest OS</text>
  <text x="790" y="175" text-anchor="middle" fill="#ef4444" font-size="9" font-weight="bold">~1GB+</text>
  
  <!-- Labels -->
  <text x="225" y="340" text-anchor="middle" fill="#34d399" font-size="11">✅ Lightweight | Fast | Shared Kernel</text>
  <text x="675" y="340" text-anchor="middle" fill="#f87171" font-size="11">❌ Heavy | Slow Boot | Full OS Each</text>
</svg>
