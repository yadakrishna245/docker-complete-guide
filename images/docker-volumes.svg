<svg fill="none" viewBox="0 0 900 250" width="900" height="250" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes pulseGreen { 0%,100%{border-color:#22c55e} 50%{border-color:#16a34a} }
        @keyframes pulseYellow { 0%,100%{border-color:#eab308} 50%{border-color:#ca8a04} }
        @keyframes pulsePurple { 0%,100%{border-color:#a855f7} 50%{border-color:#7c3aed} }
        .wrap{background:#0d1117;font-family:Arial,sans-serif;color:#e5e7eb;padding:14px;box-sizing:border-box;width:900px;height:250px;display:flex;align-items:center;gap:16px}
        .container-box{background:#1f2937;border:2px solid #6b7280;border-radius:10px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:200px}
        .container-box .title{font-weight:bold;font-size:13px}
        .container-box .app{background:#374151;border-radius:6px;padding:8px 14px;font-size:11px}
        .container-box .warn{font-size:10px;color:#ef4444;margin-top:4px}
        .arrows{display:flex;flex-direction:column;gap:12px;font-size:18px;color:#9ca3af;justify-content:center}
        .volumes{display:flex;flex-direction:column;gap:8px;flex:1}
        .vol{border:2px solid;border-radius:8px;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;font-size:11px}
        .vol-named{border-color:#22c55e;animation:pulseGreen 3s infinite;background:#1f2937}
        .vol-bind{border-color:#eab308;animation:pulseYellow 3s infinite;background:#1f2937}
        .vol-tmpfs{border-color:#a855f7;animation:pulsePurple 3s infinite;background:#1f2937}
        .vol-name{font-weight:bold}
        .vol-info{text-align:right;font-size:10px;color:#9ca3af}
      </style>
      <div class="wrap">
        <div class="container-box">
          <div class="title">📦 Container</div>
          <div class="app">🖥️ Application</div>
          <div class="warn">Filesystem ❌ Lost on rm</div>
        </div>
        <div class="arrows">→<br/>→<br/>→</div>
        <div class="volumes">
          <div class="vol vol-named">
            <span class="vol-name">📁 Named Volume</span>
            <span class="vol-info">✅ Survives rm · Best for databases</span>
          </div>
          <div class="vol vol-bind">
            <span class="vol-name">📂 Bind Mount</span>
            <span class="vol-info">✅ Survives rm · Best for dev</span>
          </div>
          <div class="vol vol-tmpfs">
            <span class="vol-name">💾 tmpfs</span>
            <span class="vol-info">❌ Lost on stop · Temp data only</span>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
