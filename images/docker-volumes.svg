<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" font-family="Arial, sans-serif">
  <rect width="900" height="280" fill="#0d1117" rx="12"/>
  <text x="450" y="30" text-anchor="middle" fill="#58a6ff" font-size="16" font-weight="bold">Docker Volumes: Persistent Storage Options</text>

  <!-- Container -->
  <rect x="30" y="55" width="200" height="160" fill="#1f2937" stroke="#6b7280" stroke-width="2" rx="10">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="130" y="80" text-anchor="middle" fill="#9ca3af" font-size="12" font-weight="bold">🐳 Container</text>
  <rect x="50" y="90" width="160" height="40" fill="#374151" rx="6"/>
  <text x="130" y="115" text-anchor="middle" fill="#d1d5db" font-size="11">Application</text>
  <rect x="50" y="140" width="160" height="40" fill="#374151" stroke="#ef4444" stroke-width="1" rx="6"/>
  <text x="130" y="157" text-anchor="middle" fill="#fca5a5" font-size="10">Container Filesystem</text>
  <text x="130" y="172" text-anchor="middle" fill="#ef4444" font-size="9">❌ Lost on rm</text>

  <!-- Arrows from container to volumes -->
  <line x1="230" y1="110" x2="310" y2="90" stroke="#10b981" stroke-width="2" stroke-dasharray="6,3">
    <animate attributeName="stroke-dashoffset" values="18;0" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <polygon points="308,85 316,88 310,93" fill="#10b981"/>

  <line x1="230" y1="130" x2="310" y2="155" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,3">
    <animate attributeName="stroke-dashoffset" values="18;0" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <polygon points="308,158 316,155 310,150" fill="#f59e0b"/>

  <line x1="230" y1="155" x2="310" y2="220" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6,3">
    <animate attributeName="stroke-dashoffset" values="18;0" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <polygon points="308,223 316,220 310,215" fill="#8b5cf6"/>

  <!-- Named Volume -->
  <rect x="320" y="55" width="250" height="70" fill="#1f2937" stroke="#10b981" stroke-width="2" rx="10">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="0.3s" repeatCount="indefinite"/>
  </rect>
  <text x="445" y="78" text-anchor="middle" fill="#34d399" font-size="12" font-weight="bold">💾 Named Volume</text>
  <text x="445" y="96" text-anchor="middle" fill="#6b7280" font-size="10">Docker managed  •  -v mydata:/app/data</text>
  <text x="445" y="113" text-anchor="middle" fill="#10b981" font-size="10" font-weight="bold">✅ Survives rm</text>

  <!-- Bind Mount -->
  <rect x="320" y="135" width="250" height="70" fill="#1f2937" stroke="#f59e0b" stroke-width="2" rx="10">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="0.6s" repeatCount="indefinite"/>
  </rect>
  <text x="445" y="158" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="bold">📁 Bind Mount</text>
  <text x="445" y="176" text-anchor="middle" fill="#6b7280" font-size="10">Host directory  •  -v /host:/container</text>
  <text x="445" y="193" text-anchor="middle" fill="#10b981" font-size="10" font-weight="bold">✅ Survives rm</text>

  <!-- tmpfs -->
  <rect x="320" y="215" width="250" height="55" fill="#1f2937" stroke="#8b5cf6" stroke-width="2" rx="10">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="0.9s" repeatCount="indefinite"/>
  </rect>
  <text x="445" y="238" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="bold">🧠 tmpfs</text>
  <text x="445" y="256" text-anchor="middle" fill="#6b7280" font-size="10">Memory only  •  --tmpfs /tmp</text>

  <!-- Use Cases -->
  <rect x="610" y="55" width="260" height="70" fill="#1f2937" stroke="#10b981" stroke-width="1" rx="8"/>
  <text x="740" y="78" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="bold">Best for:</text>
  <text x="740" y="96" text-anchor="middle" fill="#6b7280" font-size="10">Databases, production data</text>
  <text x="740" y="113" text-anchor="middle" fill="#6b7280" font-size="10">docker volume create mydata</text>

  <rect x="610" y="135" width="260" height="70" fill="#1f2937" stroke="#f59e0b" stroke-width="1" rx="8"/>
  <text x="740" y="158" text-anchor="middle" fill="#fcd34d" font-size="10" font-weight="bold">Best for:</text>
  <text x="740" y="176" text-anchor="middle" fill="#6b7280" font-size="10">Development, live code reload</text>
  <text x="740" y="193" text-anchor="middle" fill="#6b7280" font-size="10">-v $(pwd)/src:/app/src</text>

  <rect x="610" y="215" width="260" height="55" fill="#1f2937" stroke="#8b5cf6" stroke-width="1" rx="8"/>
  <text x="740" y="238" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="bold">Best for:</text>
  <text x="740" y="256" text-anchor="middle" fill="#6b7280" font-size="10">Sensitive temp data, no persist</text>

  <text x="345" y="258" text-anchor="middle" fill="#ef4444" font-size="10" font-weight="bold">❌ Lost on stop</text>
</svg>
