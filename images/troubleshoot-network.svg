<svg fill="none" viewBox="0 0 900 320" width="900" height="320" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes pulseRed { 0%,100%{border-color:#dc2626} 50%{border-color:#991b1b} }
        @keyframes pulseGreen { 0%,100%{border-color:#16a34a} 50%{border-color:#166534} }
        .wrap{background:#0d1117;padding:16px;font-family:Arial,sans-serif;color:#e5e7eb;display:flex;flex-direction:column;gap:10px;align-items:center;min-height:288px}
        .problem{background:#1f2937;border:2px solid #dc2626;border-radius:8px;padding:8px 16px;animation:pulseRed 2s infinite;font-weight:bold;font-size:14px}
        .card{background:#1f2937;border:1px solid #374151;border-radius:8px;padding:8px 12px;font-size:12px;text-align:center}
        .solution{background:#1f2937;border:2px solid #16a34a;border-radius:8px;padding:6px 10px;font-size:11px;animation:pulseGreen 2s infinite;text-align:center}
        .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
        .arrow{color:#6b7280;font-size:14px}
        .code{background:#374151;border-radius:4px;padding:2px 6px;font-family:monospace;font-size:11px;color:#60a5fa}
        .col{display:flex;flex-direction:column;gap:6px;align-items:center}
        .label{font-size:11px;color:#9ca3af}
      </style>
      <div class="wrap">
        <div class="problem">🌐 Network Issue</div>
        <div class="arrow">↓</div>
        <div class="row">
          <div class="col">
            <div class="card"><b>A) Can't Reach Internet</b></div>
            <div class="arrow">↓</div>
            <div class="card"><span class="code">docker exec ping 8.8.8.8</span></div>
            <div class="arrow">↓</div>
            <div class="solution">DNS Fix:<br/><span class="code">--dns 8.8.8.8</span><br/>or edit <span class="code">/etc/resolv.conf</span></div>
          </div>
          <div class="col">
            <div class="card"><b>B) Containers Can't Talk</b></div>
            <div class="arrow">↓</div>
            <div class="card">Same network?<br/><span class="code">docker network inspect</span></div>
            <div class="arrow">↓</div>
            <div class="solution">Use custom network:<br/><span class="code">docker network create mynet</span><br/><span class="code">--network mynet</span></div>
          </div>
          <div class="col">
            <div class="card"><b>C) Port Not Accessible</b></div>
            <div class="arrow">↓</div>
            <div class="card"><span class="code">docker port &lt;id&gt;</span></div>
            <div class="arrow">↓</div>
            <div class="solution">Add <span class="code">-p host:container</span><br/>or check firewall rules</div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
