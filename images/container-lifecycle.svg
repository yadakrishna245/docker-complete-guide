<svg fill="none" viewBox="0 0 900 400" width="900" height="400" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes pulseGray { 0%,100%{border-color:#6b7280} 50%{border-color:#9ca3af} }
        @keyframes pulseGreen { 0%,100%{border-color:#10b981} 50%{border-color:#34d399} }
        @keyframes pulseYellow { 0%,100%{border-color:#f59e0b} 50%{border-color:#fbbf24} }
        @keyframes pulseRed { 0%,100%{border-color:#ef4444} 50%{border-color:#f87171} }
        @keyframes pulseDark { 0%,100%{border-color:#4b5563} 50%{border-color:#6b7280} }
        .wrap{background:#0d1117;padding:20px;font-family:Arial,sans-serif;color:#e5e7eb;display:flex;flex-direction:column;align-items:center;height:360px;box-sizing:border-box}
        .title{font-size:18px;font-weight:bold;margin-bottom:16px;color:#fff}
        .diagram{display:flex;flex-direction:column;gap:16px;align-items:center;width:100%}
        .row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
        .state{padding:10px 22px;border-radius:30px;border:3px solid;font-weight:bold;font-size:14px;text-align:center;background:#1f2937}
        .created{animation:pulseGray 2s infinite;color:#9ca3af}
        .running{animation:pulseGreen 2s infinite;color:#10b981}
        .paused{animation:pulseYellow 2s infinite;color:#f59e0b}
        .stopped{animation:pulseRed 2s infinite;color:#ef4444}
        .removed{animation:pulseDark 2s infinite;color:#6b7280}
        .arrow{font-size:12px;color:#9ca3af;display:flex;flex-direction:column;align-items:center;gap:2px}
        .arrow .cmd{font-size:10px;background:#374151;padding:2px 6px;border-radius:4px;color:#d1d5db;white-space:nowrap}
        .arrow .sym{font-size:16px}
        .section{display:flex;flex-direction:column;gap:12px;align-items:center}
        .sub-row{display:flex;align-items:center;gap:8px}
      </style>
      <div class="wrap">
        <div class="title">🔄 Container Lifecycle</div>
        <div class="diagram">
          <div class="row">
            <div class="state created">⬡ Created</div>
            <div class="arrow"><span class="cmd">docker start</span><span class="sym">→</span></div>
            <div class="state running">▶ Running</div>
            <div class="arrow"><span class="cmd">docker pause</span><span class="sym">→</span></div>
            <div class="state paused">⏸ Paused</div>
          </div>
          <div class="row">
            <div class="arrow"><span class="cmd">docker create</span><span class="sym">↑</span></div>
            <div style="width:60px"></div>
            <div class="arrow"><span class="cmd">docker unpause</span><span class="sym">↑ back to Running</span></div>
          </div>
          <div class="row">
            <div class="state running">▶ Running</div>
            <div class="arrow"><span class="cmd">docker stop</span><span class="sym">→</span></div>
            <div class="state stopped">⏹ Stopped</div>
            <div class="arrow"><span class="cmd">docker start</span><span class="sym">→</span></div>
            <div class="state running">▶ Running</div>
          </div>
          <div class="row">
            <div class="state created">⬡ Created</div>
            <div class="arrow"><span class="cmd">docker rm</span><span class="sym">→</span></div>
            <div class="state removed">🗑 Removed</div>
            <div style="width:20px"></div>
            <div class="state stopped">⏹ Stopped</div>
            <div class="arrow"><span class="cmd">docker rm</span><span class="sym">→</span></div>
            <div class="state removed">🗑 Removed</div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
