<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Arial, sans-serif">
  <rect width="900" height="400" fill="#0d1117" rx="12"/>
  <text x="450" y="35" text-anchor="middle" fill="#58a6ff" font-size="16" font-weight="bold">Container Lifecycle</text>

  <!-- Created State -->
  <rect x="370" y="55" width="160" height="50" fill="#1f2937" stroke="#6b7280" stroke-width="2" rx="25">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="450" y="85" text-anchor="middle" fill="#9ca3af" font-size="13" font-weight="bold">⚪ Created</text>

  <!-- Running State -->
  <rect x="370" y="155" width="160" height="50" fill="#1f2937" stroke="#10b981" stroke-width="2.5" rx="25">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="450" y="185" text-anchor="middle" fill="#34d399" font-size="13" font-weight="bold">🟢 Running</text>

  <!-- Paused State -->
  <rect x="100" y="270" width="150" height="50" fill="#1f2937" stroke="#f59e0b" stroke-width="2" rx="25">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" begin="0.5s" repeatCount="indefinite"/>
  </rect>
  <text x="175" y="300" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="bold">🟡 Paused</text>

  <!-- Stopped State -->
  <rect x="375" y="270" width="150" height="50" fill="#1f2937" stroke="#ef4444" stroke-width="2" rx="25">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" begin="1s" repeatCount="indefinite"/>
  </rect>
  <text x="450" y="300" text-anchor="middle" fill="#f87171" font-size="13" font-weight="bold">🔴 Stopped</text>

  <!-- Removed State -->
  <rect x="640" y="270" width="150" height="50" fill="#1f2937" stroke="#6b7280" stroke-width="2" rx="25">
    <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </rect>
  <text x="715" y="300" text-anchor="middle" fill="#9ca3af" font-size="13" font-weight="bold">⚫ Removed</text>

  <!-- Arrow: Created → Running (docker start) -->
  <line x1="450" y1="105" x2="450" y2="155" stroke="#10b981" stroke-width="2" stroke-dasharray="6,3">
    <animate attributeName="stroke-dashoffset" values="18;0" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <polygon points="445,155 450,163 455,155" fill="#10b981"/>
  <text x="490" y="133" fill="#6ee7b7" font-size="10">docker start</text>

  <!-- Arrow: Running → Paused (docker pause) -->
  <line x1="370" y1="195" x2="225" y2="270" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,3">
    <animate attributeName="stroke-dashoffset" values="18;0" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <polygon points="228,265 220,273 230,273" fill="#f59e0b"/>
  <text x="270" y="235" fill="#fcd34d" font-size="10">docker pause</text>

  <!-- Arrow: Paused → Running (docker unpause) -->
  <line x1="200" y1="270" x2="380" y2="205" stroke="#10b981" stroke-width="2" stroke-dasharray="6,3">
    <animate attributeName="stroke-dashoffset" values="18;0" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <polygon points="377,208 385,202 378,200" fill="#10b981"/>
  <text x="270" y="250" fill="#6ee7b7" font-size="10">docker unpause</text>

  <!-- Arrow: Running → Stopped (docker stop) -->
  <line x1="450" y1="205" x2="450" y2="270" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,3">
    <animate attributeName="stroke-dashoffset" values="18;0" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <polygon points="445,270 450,278 455,270" fill="#ef4444"/>
  <text x="490" y="240" fill="#fca5a5" font-size="10">docker stop</text>

  <!-- Arrow: Stopped → Running (docker start) -->
  <line x1="420" y1="270" x2="420" y2="210" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,3">
    <animate attributeName="stroke-dashoffset" values="14;0" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <polygon points="415,210 420,202 425,210" fill="#10b981"/>
  <text x="385" y="240" fill="#6ee7b7" font-size="9">start</text>

  <!-- Arrow: Running → Removed (docker rm -f) -->
  <line x1="530" y1="190" x2="660" y2="275" stroke="#6b7280" stroke-width="2" stroke-dasharray="6,3">
    <animate attributeName="stroke-dashoffset" values="18;0" dur="1s" repeatCount="indefinite"/>
  </line>
  <polygon points="657,270 665,278 660,268" fill="#6b7280"/>
  <text x="620" y="230" fill="#9ca3af" font-size="10">docker rm -f</text>

  <!-- Arrow: Stopped → Removed (docker rm) -->
  <line x1="525" y1="295" x2="640" y2="295" stroke="#6b7280" stroke-width="2" stroke-dasharray="6,3">
    <animate attributeName="stroke-dashoffset" values="18;0" dur="1s" repeatCount="indefinite"/>
  </line>
  <polygon points="640,290 648,295 640,300" fill="#6b7280"/>
  <text x="583" y="288" fill="#9ca3af" font-size="10">docker rm</text>

  <!-- Legend -->
  <text x="450" y="380" text-anchor="middle" fill="#4b5563" font-size="10">docker create → start → pause/stop → rm | Full container state machine</text>
</svg>
