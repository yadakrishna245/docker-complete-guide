<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" font-family="Arial, sans-serif">
  <rect width="900" height="280" fill="#0d1117" rx="12"/>
  <text x="450" y="30" text-anchor="middle" fill="#58a6ff" font-size="16" font-weight="bold">Dockerfile → Image → Container Workflow</text>

  <!-- Dockerfile -->
  <rect x="30" y="80" width="140" height="100" fill="#1f2937" stroke="#6366f1" stroke-width="2" rx="10">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="100" y="115" text-anchor="middle" fill="#818cf8" font-size="24">📝</text>
  <text x="100" y="143" text-anchor="middle" fill="#a5b4fc" font-size="12" font-weight="bold">Dockerfile</text>
  <text x="100" y="163" text-anchor="middle" fill="#6b7280" font-size="10">Instructions</text>

  <!-- Arrow 1: docker build -->
  <line x1="170" y1="130" x2="230" y2="130" stroke="#6366f1" stroke-width="2" stroke-dasharray="6,3">
    <animate attributeName="stroke-dashoffset" values="18;0" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <polygon points="230,125 240,130 230,135" fill="#6366f1"/>
  <text x="200" y="118" fill="#a5b4fc" font-size="9">docker build</text>

  <!-- Image -->
  <rect x="240" y="80" width="140" height="100" fill="#1f2937" stroke="#3b82f6" stroke-width="2" rx="10">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="0.5s" repeatCount="indefinite"/>
  </rect>
  <text x="310" y="115" text-anchor="middle" fill="#60a5fa" font-size="24">📦</text>
  <text x="310" y="143" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="bold">Image</text>
  <text x="310" y="163" text-anchor="middle" fill="#6b7280" font-size="10">Read-only template</text>

  <!-- Arrow 2: docker run -->
  <line x1="380" y1="130" x2="440" y2="130" stroke="#10b981" stroke-width="2" stroke-dasharray="6,3">
    <animate attributeName="stroke-dashoffset" values="18;0" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <polygon points="440,125 450,130 440,135" fill="#10b981"/>
  <text x="410" y="118" fill="#6ee7b7" font-size="9">docker run</text>

  <!-- Container -->
  <rect x="450" y="80" width="140" height="100" fill="#1f2937" stroke="#10b981" stroke-width="2" rx="10">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="1s" repeatCount="indefinite"/>
  </rect>
  <text x="520" y="115" text-anchor="middle" fill="#34d399" font-size="24">🐳</text>
  <text x="520" y="143" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="bold">Container</text>
  <text x="520" y="163" text-anchor="middle" fill="#6b7280" font-size="10">Running instance</text>

  <!-- Arrow 3: docker commit -->
  <line x1="590" y1="130" x2="650" y2="130" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,3">
    <animate attributeName="stroke-dashoffset" values="18;0" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <polygon points="650,125 660,130 650,135" fill="#f59e0b"/>
  <text x="620" y="118" fill="#fcd34d" font-size="9">docker commit</text>

  <!-- New Image -->
  <rect x="660" y="80" width="140" height="100" fill="#1f2937" stroke="#f59e0b" stroke-width="2" rx="10">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </rect>
  <text x="730" y="115" text-anchor="middle" fill="#fbbf24" font-size="24">📦</text>
  <text x="730" y="143" text-anchor="middle" fill="#fcd34d" font-size="12" font-weight="bold">New Image</text>
  <text x="730" y="163" text-anchor="middle" fill="#6b7280" font-size="10">Custom image</text>

  <!-- Arrow 4: docker push (from Image down to Registry) -->
  <line x1="310" y1="180" x2="310" y2="220" stroke="#ec4899" stroke-width="2" stroke-dasharray="6,3">
    <animate attributeName="stroke-dashoffset" values="18;0" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <polygon points="305,220 310,228 315,220" fill="#ec4899"/>
  <text x="340" y="205" fill="#f9a8d4" font-size="9">docker push</text>

  <!-- Registry -->
  <rect x="240" y="230" width="140" height="40" fill="#1f2937" stroke="#ec4899" stroke-width="2" rx="10">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="2s" repeatCount="indefinite"/>
  </rect>
  <text x="310" y="255" text-anchor="middle" fill="#f472b6" font-size="12" font-weight="bold">📚 Registry</text>

  <!-- Animated dots -->
  <circle r="3" fill="#6366f1">
    <animateMotion dur="6s" repeatCount="indefinite" path="M100,130 L310,130 L520,130 L730,130"/>
  </circle>
  <circle r="3" fill="#ec4899">
    <animateMotion dur="3s" begin="2s" repeatCount="indefinite" path="M310,180 L310,230"/>
  </circle>
</svg>
