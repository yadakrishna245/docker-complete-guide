<svg fill="none" viewBox="0 0 900 250" width="900" height="250" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes pulsePurple { 0%,100%{border-color:#8b5cf6} 50%{border-color:#a78bfa} }
        @keyframes pulseBlue { 0%,100%{border-color:#3b82f6} 50%{border-color:#60a5fa} }
        @keyframes pulseGreen { 0%,100%{border-color:#10b981} 50%{border-color:#34d399} }
        @keyframes pulseYellow { 0%,100%{border-color:#f59e0b} 50%{border-color:#fbbf24} }
        @keyframes pulsePink { 0%,100%{border-color:#ec4899} 50%{border-color:#f472b6} }
        .wrap{background:#0d1117;padding:16px;font-family:Arial,sans-serif;color:#e5e7eb;display:flex;flex-direction:column;align-items:center;height:218px;box-sizing:border-box}
        .title{font-size:16px;font-weight:bold;margin-bottom:12px;color:#fff}
        .flow{display:flex;align-items:center;gap:8px}
        .box{background:#1f2937;border:3px solid;border-radius:10px;padding:10px 14px;text-align:center;min-width:90px}
        .box .icon{font-size:18px}
        .box .name{font-size:12px;font-weight:bold;margin-top:2px}
        .purple{animation:pulsePurple 2s infinite}
        .blue{animation:pulseBlue 2s infinite}
        .green{animation:pulseGreen 2s infinite}
        .yellow{animation:pulseYellow 2s infinite}
        .pink{animation:pulsePink 2s infinite}
        .arr{font-size:11px;color:#9ca3af;display:flex;flex-direction:column;align-items:center;gap:1px}
        .arr .sym{font-size:16px}
        .arr .cmd{font-size:9px;background:#374151;padding:2px 5px;border-radius:3px;white-space:nowrap}
        .sub-flow{display:flex;align-items:center;gap:8px;margin-top:10px}
        .connector{color:#9ca3af;font-size:12px}
      </style>
      <div class="wrap">
        <div class="title">📋 Dockerfile → Image → Container Workflow</div>
        <div class="flow">
          <div class="box purple"><div class="icon">📄</div><div class="name">Dockerfile</div></div>
          <div class="arr"><span class="cmd">docker build</span><span class="sym">→</span></div>
          <div class="box blue"><div class="icon">💿</div><div class="name">Image</div></div>
          <div class="arr"><span class="cmd">docker run</span><span class="sym">→</span></div>
          <div class="box green"><div class="icon">📦</div><div class="name">Container</div></div>
          <div class="arr"><span class="cmd">docker commit</span><span class="sym">→</span></div>
          <div class="box yellow"><div class="icon">💿</div><div class="name">New Image</div></div>
        </div>
        <div class="sub-flow">
          <span class="connector">Image</span>
          <div class="arr"><span class="cmd">docker push</span><span class="sym">→</span></div>
          <div class="box pink"><div class="icon">☁️</div><div class="name">Registry</div></div>
          <div class="arr"><span class="cmd">docker pull</span><span class="sym">←</span></div>
          <span class="connector">Image</span>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
