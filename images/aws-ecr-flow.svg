<svg fill="none" viewBox="0 0 900 260" width="900" height="260" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes pulseOrange { 0%,100%{border-color:#f97316} 50%{border-color:#ea580c} }
        @keyframes pulseBlue { 0%,100%{border-color:#3b82f6} 50%{border-color:#1d4ed8} }
        .wrap{background:#0d1117;font-family:Arial,sans-serif;color:#e5e7eb;padding:16px;box-sizing:border-box;width:900px;height:260px;display:flex;align-items:center;justify-content:center;gap:20px}
        .dev{background:#1f2937;border:2px solid #6b7280;border-radius:10px;padding:16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
        .dev-icon{font-size:32px}
        .dev-label{font-size:12px;font-weight:bold}
        .arrow-section{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:#f97316}
        .arrow-section .line{font-size:18px}
        .ecr-box{background:#1f2937;border:2px solid #f97316;animation:pulseOrange 3s infinite;border-radius:10px;padding:16px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
        .ecr-box .icon{font-size:28px}
        .ecr-box .title{font-size:14px;font-weight:bold;color:#f97316}
        .ecr-box .sub{font-size:10px;color:#9ca3af}
        .targets{display:flex;flex-direction:column;gap:6px}
        .target{background:#374151;border:2px solid #3b82f6;animation:pulseBlue 3s infinite;border-radius:6px;padding:6px 14px;font-size:11px;text-align:center}
        .pull-section{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:#3b82f6}
        .pull-section .line{font-size:18px}
      </style>
      <div class="wrap">
        <div class="dev">
          <div class="dev-icon">👨‍💻</div>
          <div class="dev-label">Developer</div>
        </div>
        <div class="arrow-section">
          <div class="line">→→→</div>
          <div>docker push</div>
        </div>
        <div class="ecr-box">
          <div class="icon">📦</div>
          <div class="title">AWS ECR</div>
          <div class="sub">Elastic Container Registry</div>
        </div>
        <div class="pull-section">
          <div class="line">→→→</div>
          <div>docker pull</div>
        </div>
        <div class="targets">
          <div class="target">🚀 ECS (Fargate)</div>
          <div class="target">☸️ EKS (Kubernetes)</div>
          <div class="target">🖥️ EC2 Instances</div>
          <div class="target">⚡ Lambda</div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
